<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Check</title><style>body{font-family:system-ui,sans-serif;padding:24px;line-height:1.6;background:#fafafa;color:#222}table{border-collapse:collapse;width:100%;max-width:1100px;background:#fff}th,td{border:1px solid #ddd;padding:8px;text-align:left;vertical-align:top;font-size:14px}th{background:#f2f2f2}.ok{color:#187a39}.ng{color:#b42318}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}img{max-width:260px;max-height:180px;border:1px solid #ccc;margin-top:6px}</style></head><body><h1>Production Asset Diagnostics</h1><p>HTTP応答と画像デコードの両方を確認します。本番用JPEG/PNGと旧WebP互換URLを同時に検査します。</p><table><thead><tr><th>Path</th><th>HTTP</th><th>Content-Type</th><th>Length</th><th>Image decode</th></tr></thead><tbody id="rows"></tbody></table><script>const files=['/styles.css','/image-fix.css','/app.js','/assets/study.jpg','/assets/editorial.jpg','/assets/kaito-logo-transparent.png','/assets/study.webp','/assets/editorial.webp','/assets/kaito-logo-transparent.webp','/favicon.svg','/og-image.png'];const rows=document.getElementById('rows');for(const src of files){const tr=document.createElement('tr');tr.innerHTML='<td class="mono">'+src+'</td><td>checking</td><td></td><td></td><td></td>';rows.append(tr);const cells=tr.children;fetch(src+'?diag=20260915-1',{cache:'no-store'}).then(async r=>{cells[1].textContent=r.status+' '+r.statusText;cells[1].className=r.ok?'ok':'ng';cells[2].textContent=r.headers.get('content-type')||'(none)';cells[3].textContent=r.headers.get('content-length')||'(unknown)';if(!src.match(/\.(svg|webp|png|jpe?g)$/i)){cells[4].textContent='n/a';return;}const img=new Image();img.onload=()=>{cells[4].textContent='OK '+img.naturalWidth+'×'+img.naturalHeight;cells[4].className='ok'};img.onerror=()=>{cells[4].textContent='NG';cells[4].className='ng'};img.src=src+'?imgdiag=20260915-1'}).catch(e=>{cells[1].textContent='FETCH ERROR';cells[1].className='ng';cells[2].textContent=e.message;cells[4].textContent='n/a'});}</script></body></html>

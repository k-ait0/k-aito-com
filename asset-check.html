<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Check</title><style>body{font-family:system-ui,sans-serif;padding:24px;line-height:1.6}img{max-width:420px;display:block;margin:12px 0;border:1px solid #ccc}.ok{color:#187a39}.ng{color:#b42318}</style></head><body><h1>Root Asset Check</h1><div id="out"></div><script>const files=['/study.svg','/editorial.svg','/kaito-logo.svg','/favicon.svg','/og-image.svg'];const out=document.getElementById('out');for(const src of files){const wrap=document.createElement('section');const p=document.createElement('p');p.textContent=src+' : 読み込み中';const img=new Image();img.src=src+'?check=20260914-2';img.onload=()=>{p.textContent=src+' : OK '+img.naturalWidth+'×'+img.naturalHeight;p.className='ok'};img.onerror=()=>{p.textContent=src+' : NG';p.className='ng'};wrap.append(p,img);out.append(wrap)}</script></body></html>

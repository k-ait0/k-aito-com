<script>
const bank=JSON.parse(document.getElementById("data-bank").textContent);
const audit=JSON.parse(document.getElementById("data-audit").textContent);
const alts=JSON.parse(document.getElementById("data-alts").textContent);
const items=new Map(bank.items.map(x=>[x.id,x]));
const reviews=new Map(audit.items.map(x=>[x.id,x]));
const alternatives=new Map(alts.items.map(x=>[x.id,x]));
const label={
 CONDITIONAL_PILOT:"条件付き試行",
 REVISE_BEFORE_PILOT:"改稿後に再審査",
 HOLD_FOR_CONTENT_RISK:"保留"
};
const $$=(id)=>document.getElementById(id);
const make=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;};
function render(){
 const a=$$("axis").value,status=$$("status").value,q=$$("search").value.trim().toLocaleLowerCase();
 const filtered=audit.items.filter(x=>(a==="all"||x.axis===a)&&(status==="all"||x.status===status))
 .filter(x=>{const b=items.get(x.id);return [x.id,b.stem,b.negative,b.positive,x.rationale,x.nearby.join(",")].join(" ").toLocaleLowerCase().includes(q)});
 $$("result-count").textContent=filtered.length+" / 50 件表示";
 const container=$$("list");container.replaceChildren();
 for(const x of filtered){
  const b=items.get(x.id),alt=alternatives.get(x.id),article=make("article","item");
  const hdr=make("header","head");
  const title=make("h3","",""+x.id+" "+x.axis+"軸");
  const st=make("span","status "+x.status, label[x.status]||x.status);
  hdr.append(title,st);article.append(hdr);
  const p=make("p","question",b.stem);article.append(p);
  const columns=make("div","choices");
  columns.append(make("p","","左： "+b.negative),make("p","","右： "+b.positive));
  article.append(columns);
  article.append(make("p","risk","問題： "+x.rationale));
  article.append(make("p","ref","近い設問： "+(x.nearby.length?x.nearby.join(" / "):"—")+"　　由来： "+b.source));
  if(alt){
   const det=make("details","alt"),sum=make("summary","","比較用の改稿案を表示（未承認）");det.append(sum);
   det.append(make("p","question",alt.stem));
   const row=make("div","choices");row.append(make("p","","左： "+alt.negative),make("p","","右： "+alt.positive));det.append(row);
   det.append(make("p","risk","変更目的： "+alt.additionalInfo));
   det.append(make("p","risk","残る懸念： "+alt.risk));
   det.append(make("p","ref","扱い： "+(alt.status==="PROBE_ONLY_DO_NOT_SCORE"?"得点化しない確認設問":"改稿候補・要審査")));
   article.append(det);
  }
  container.append(article);
 }
}
for(const id of ["axis","status","search"]){
 $$(""+id).addEventListener(id==="search"?"input":"change",render);
}
const targets={A:7,B:7,C:7,D:7,E:2};
const box=$$("readiness");
for(const ax of ["A","B","C","D","E"]){
 const trial=audit.items.filter(x=>x.axis===ax&&x.status==="CONDITIONAL_PILOT").length;
 const el=make("div","pill-summary", ax+"軸：試行候補 "+trial+" / "+targets[ax]+"問、 不足 "+Math.max(0,targets[ax]-trial));
 box.append(el);
}
render();
</script></body></html>

le":"02｜あなたが選択するときの4つの視点","items":[{"axis":"A","label":"環境","orientation":"安定寄り","text":"慣れた環境の継続を重視する設定。ただし変化を拒むと決めるものではありません。"},{"axis":"B","label":"意思決定","orientation":"自律寄り","text":"自分の希望を整理して選ぶ視点。ただし他者への配慮と両立します。"},{"axis":"C","label":"時間","orientation":"将来寄り","text":"少し先に得たい充実も考える視点。今の楽しみを否定するものではありません。"},{"axis":"D","label":"経験","orientation":"深耕寄り","text":"特定の分野を続けて深める設定。新しい活動を試せないわけではありません。"}]},{"id":"choices","title":"03｜この価値観を活かせる選択","body":"一年かけて調べたいテーマを選ぶなら、使える時間と資料を先に見積もり、月ごとに問いを一つずつ深める計画が考えられます。予定のすべてを研究に寄せる必要はありません。"},{"id":"dilemmas","title":"04｜迷いが生まれやすい分岐点","body":"一つを深めたい気持ちと、別の分野への関心が両立する場合もあります。続ける理由が薄れたら『根気がない』と判断せず、テーマや方法を調整する余地を残せます。"},{"id":"relationships","title":"05｜人と一緒に進めるとき","body":"自分のペースを確保しながら、相手が必要とする共有の頻度を相談して決める方法があります。集中したい時間と対話する時間を先に分けることができます。"},{"id":"actions","title":"06｜次の一歩","questions":["一年後に理解を深めていたいテーマは何ですか。","継続するために守りたい時間や場所はどこですか。","学びの方向を見直すきっかけを何にしますか。"],"closing":"ここで挙げた問いへの答えは、生活の状況や経験によって変わっても構いません。"}],"disclaimer":"この結果は暫定的な16キャラクター設定と今回の回答を整理するための文章案です。性格・能力・適職・将来の行動を判定しません。B軸・E軸を含め科学的妥当性は未検証です。","authoring":"AI_PHASE1_EDITORIAL_DRAFT","humanReviewed":false,"independentReviewed":false,"ownerApprovedForPublication":false,"scientificValidated":false,"production":false},{"typeId":"T03","groupId":"G1","name":"マイペースな発見家","emoji":"🔎","shortSummary":"落ち着いた暮らしで多様な体験を楽しむ","tagline":"身近な安心から、今日の新しい発見を拾う。","formatVersion":"A05-PHASE1-SHORT-1.0.0-draft","sections":[{"id":"living","title":"01｜大切にしたい暮らしのかたち","body":"暮らしの基盤を保ちながら、日々の中で新しい体験を見つける設定です。大きな転機だけが変化ではありません。近所の展示、初めての料理、短い学びなどにも選択肢があります。"},{"id":"axes","title":"02｜あなたが選択するときの4つの視点","items":[{"axis":"A","label":"環境","orientation":"安定寄り","text":"慣れた環境の継続を重視する設定。ただし変化を拒むと決めるものではありません。"},{"axis":"B","label":"意思決定","orientation":"自律寄り","text":"自分の希望を整理して選ぶ視点。ただし他者への配慮と両立します。"},{"axis":"C","label":"時間","orientation":"現在寄り","text":"今の生活で得たい充実に目を向ける視点。将来を考えないという意味ではありません。"},{"axis":"D","label":"経験","orientation":"探索寄り","text":"経験する分野や活動の幅を考える設定。一つを深める選択もできます。"}]},{"id":"c 生活環境","first":"安定寄り","second":"変化寄り","relation":"different"},{"axis":"B","label":"意思決定","first":"自律寄り","second":"つながり寄り","relation":"different"},{"axis":"C","label":"時間の優先","first":"将来寄り","second":"現在寄り","relation":"different"},{"axis":"D","label":"経験の幅と深さ","first":"探索寄り","second":"深耕寄り","relation":"different"}],"sourceStoryOrigin":"P3_PILOT16_20261104","sourceMasterOriginalCopy":"学びを増やす計画と、好きな活動の楽しさを人と共有する企画を仮に並べます。設定上は生活基盤・時間の使い方・意思決定の関わり方に異なる視点がありますが、実際の希望が反対だとは限りません。","context":"生活改善の勉強会","sections":[{"id":"shared","title":"01｜共通する視点","body":"「着実な開拓者」は「安心できる基盤から将来の選択肢を広げる」、「情熱を分かち合う人」は「好きなことの喜びを人と分かち合う」という暫定的な編集設定です。設定上4軸すべてのラベルが異なります。ただし、全軸が違うことを不適合の証拠にしたり、逆に補完関係が成立すると推測したりはできません。"},{"id":"different","title":"02｜違いから見えてくる問い","body":"A軸の違いについては、生活環境を維持する案と、何かを変えて試す案をどちらも並べてみます。移動できるかどうかと希望するかどうかは分けて考えます。本人が決めたい範囲と関係者の意見を聞きたい範囲を分けます。自律とつながりは反対の性格を指すものではありません。残る2軸の相違も、実際の行動を決めつけず話し合う材料にします。"},{"id":"scenario","title":"03｜具体的な場面で考える","body":"一か月の展示企画を例に、学習テーマを複数試す活動と、好きな作品を人と深く味わう活動を並べます。二つの設定は生活環境・相談の仕方・時間の見通し・経験の幅の4軸で異なります。ただし展示準備で将来を考えつつ当日の楽しみも作れます。どちらが適しているかを決めるのでなく、時間・費用と関係者への相談の仕方を具体化します。"},{"id":"dilemma","title":"04｜考え方が食い違ったとき","body":"生活改善の勉強会を続ける途中で、着実な開拓者の活動例と情熱を分かち合う人の活動例に割ける時間が変わるかもしれません。変更が生じたときは、誰の負担が増えるかと何を維持したいかを確認できます。 特に相談する範囲は、本人の希望と関係者の希望を別々に聞いて決められます。"},{"id":"questions","title":"05｜ふたりで話してみたい3つの質問","questions":["一か月の準備期間で、試作する活動と展示当日を楽しむ活動にそれぞれ何日使えますか。","会場や企画を変える判断では、個人で決めたい内容と参加者に相談したい内容は何ですか。","展示後に残したい成果と、当日体験したいことをそれぞれ一つ挙げると何ですか。"]},{"id":"usage","title":"06｜この比較の使い方","body":"設定上の一致数や相違数は相性点ではありません。異なる意見を無理に一致させず、実際に何を大切にしたいか確かめるために使ってください。"}],"disclaimer":"これは暫定16キャラクターの設定を比較する編集用ガイドです。実際の人の性格・適性・相性の良否・関係の将来を判定しません。B軸を含む分類は未検証で、判断するときは本人の希望と事情を優先してください。","authoring":"AI_PHASE1_EDITORIAL_DRAFT","humanReviewed":false,"independentReviewed":false,"ownerApprovedForPublication":false,"scientificValidated":false,"production":false},{"pairId":"T02-T15","typeIds":["T02","T15"],"typeNames":["静かな探究者","出会いを楽しむ旅人"],"formatVersion":"A05-PHASE1-SHORT ody":"「マイペースな発見家」は「落ち着いた暮らしで多様な体験を楽しむ」、「出会いを楽しむ旅人」は「人との出会いと新しい経験を楽しむ」という暫定的な編集設定です。設定上、時間の優先・経験の幅と深さの2軸は共通します。一方、同じラベルでも経験・希望・使える時間まで同じと決めるものではありません。"},{"id":"different","title":"02｜違いから見えてくる問い","body":"A軸の違いについては、生活環境を維持する案と、何かを変えて試す案をどちらも並べてみます。移動できるかどうかと希望するかどうかは分けて考えます。本人が決めたい範囲と関係者の意見を聞きたい範囲を分けます。自律とつながりは反対の性格を指すものではありません。"},{"id":"scenario","title":"03｜具体的な場面で考える","body":"「身近な場所で初めての体験を探す」案と「新しい出会いから活動の幅を広げる」案を、週末の体験講座の中で並べてみます。一回で試せる内容と、続けるかどうかの判断を分けることが第一歩です。担当をタイプ名で決めず、実際に興味がある作業を各自が選び直せるようにします。 一方の案だけを採用する必要はなく、最初の一回で試す内容と長期的に続けたい内容を分けられます。"},{"id":"dilemma","title":"04｜考え方が食い違ったとき","body":"週末の体験講座への関わり方が一致しない場合も、相手の性格が原因と決める必要はありません。身近な体験を組み合わせる希望と交流する相手と場を選ぶ希望を別々に聞き、どちらも無理のない小さな案を作ります。 特に相談する範囲は、本人の希望と関係者の希望を別々に聞いて決められます。"},{"id":"questions","title":"05｜ふたりで話してみたい3つの質問","questions":["「身近な場所で初めての体験を探す」案と「新しい出会いから活動の幅を広げる」案なら、週末の体験講座で最初にどちらを試したいですか。","週末の体験講座を進める場合、「マイペースな発見家」側と「出会いを楽しむ旅人」側はそれぞれどの生活上の条件を維持し、どこなら変更を試したいですか。","「身近な体験を組み合わせる」希望と「交流する相手と場を選ぶ」希望を両方取り入れるには、どんな順番や役割が考えられますか。"]},{"id":"usage","title":"06｜この比較の使い方","body":"設定上の一致数や相違数は相性点ではありません。異なる意見を無理に一致させず、実際に何を大切にしたいか確かめるために使ってください。"}],"disclaimer":"これは暫定16キャラクターの設定を比較する編集用ガイドです。実際の人の性格・適性・相性の良否・関係の将来を判定しません。B軸を含む分類は未検証で、判断するときは本人の希望と事情を優先してください。","authoring":"AI_PHASE1_EDITORIAL_DRAFT","humanReviewed":false,"independentReviewed":false,"ownerApprovedForPublication":false,"scientificValidated":false,"production":false},{"pairId":"T03-T16","typeIds":["T03","T16"],"typeNames":["マイペースな発見家","情熱を分かち合う人"],"formatVersion":"A05-PHASE1-SHORT-1.0.0-draft","sameType":false,"structuralSharedAxisCount":1,"structuralDifferentAxisCount":3,"axisComparison":[{"axis":"A","label":"生活環境","first":"安定寄り","second":"変化寄り","relation":"different"},{"axis":"B","label":"意思決定","first":"自律寄り","second":"つながり寄り","relation":"different"},{"axis":"C","label":"時間の優先","first":"現在寄り","second":"現在寄り","relation":"shared"},{"axis":"D","label":"経験の幅と深さ","first":"探索寄り","second":"深耕寄り","relation":"different"}],"sourceStoryOrigin":"NEW_CO つの制作に集中する時間をどう配分しますか。","場所や道具を変える必要がある場合、生活上のどの条件は維持したいですか。"]},{"id":"usage","title":"06｜この比較の使い方","body":"設定上の一致数や相違数は相性点ではありません。異なる意見を無理に一致させず、実際に何を大切にしたいか確かめるために使ってください。"}],"disclaimer":"これは暫定16キャラクターの設定を比較する編集用ガイドです。実際の人の性格・適性・相性の良否・関係の将来を判定しません。B軸を含む分類は未検証で、判断するときは本人の希望と事情を優先してください。","authoring":"AI_PHASE1_EDITORIAL_DRAFT","humanReviewed":false,"independentReviewed":false,"ownerApprovedForPublication":false,"scientificValidated":false,"production":false},{"pairId":"T02-T03","typeIds":["T02","T03"],"typeNames":["静かな探究者","マイペースな発見家"],"formatVersion":"A05-PHASE1-SHORT-1.0.0-draft","sameType":false,"structuralSharedAxisCount":2,"structuralDifferentAxisCount":2,"axisComparison":[{"axis":"A","label":"生活環境","first":"安定寄り","second":"安定寄り","relation":"shared"},{"axis":"B","label":"意思決定","first":"自律寄り","second":"自律寄り","relation":"shared"},{"axis":"C","label":"時間の優先","first":"将来寄り","second":"現在寄り","relation":"different"},{"axis":"D","label":"経験の幅と深さ","first":"深耕寄り","second":"探索寄り","relation":"different"}],"sourceStoryOrigin":"NEW_COMPOSED_PHASE1","sourceMasterOriginalCopy":"たとえば、「関心のある分野を継続して学ぶ」と「日常に小さな体験を加える」をそれぞれ考えます。どちらか一方を選ぶ必要はなく、実際の希望や使える時間は人によって異なります。設定上の相違の一つは「今の充実と将来への準備」です。一方のラベルは「将来」、他方は「現在」ですが、今を大切にすることと将来を考えることは両立できます。共通する暫定ラベルは「安定」です。ただし、安心できる生活基盤について考える場合も、具体的な希望が一致するとは限りません。","context":"半年間の共同学習","sections":[{"id":"shared","title":"01｜共通する視点","body":"「静かな探究者」は「自分のペースで長期目標を深める」、「マイペースな発見家」は「落ち着いた暮らしで多様な体験を楽しむ」という暫定的な編集設定です。設定上、生活環境・意思決定の2軸は共通します。一方、同じラベルでも経験・希望・使える時間まで同じと決めるものではありません。"},{"id":"different","title":"02｜違いから見えてくる問い","body":"C軸の違いについては、今この活動で得たい充実と、半年後に残したい成果を別々に書き出せます。どちらかが正しいという評価はしません。多くのことを一度試す時間と、好きな一つを深める時間を区別します。同じ人が場面に応じて両方を使い分けることもあります。"},{"id":"scenario","title":"03｜具体的な場面で考える","body":"半年間の共同学習を検討するなら、一方に「一つの研究テーマを時間をかけて調べる」、もう一方に「身近な場所で初めての体験を探す」という活動例を置けます。両方の活動を一人で行う場合もあるため、役割の割当ではなく希望を整理する資料として使います。短く試す期間と継続して深める期間を分ける方法も考えられます。 準備の負担が大きい場合は、今ある場所や道具を活かした小規模な試行に置き換えることもできます。"},{"id":"dilemma","title":"04｜考え方が食い違ったとき","body":"半年間の共同学 rOriginalCopy":"たとえば、「関心のある分野を継続して学ぶ」と「理想に向けて活動方法を見直す」をそれぞれ考えます。どちらか一方を選ぶ必要はなく、実際の希望や使える時間は人によって異なります。設定上の相違の一つは「生活環境を変えるか維持するか」です。一方のラベルは「安定」、他方は「変化」ですが、住む環境は維持しつつ、新しい活動を試すという選択も考えられます。共通する暫定ラベルは「自律」です。ただし、意思決定の進め方について考える場合も、具体的な希望が一致するとは限りません。","context":"公開読書会","sections":[{"id":"shared","title":"01｜共通する視点","body":"「静かな探究者」は「自分のペースで長期目標を深める」、「変革の探究者」は「変化を力に一つの理想を追求する」という暫定的な編集設定です。設定上、意思決定・時間の優先・経験の幅と深さの3軸は共通します。一方、同じラベルでも経験・希望・使える時間まで同じと決めるものではありません。"},{"id":"different","title":"02｜違いから見えてくる問い","body":"A軸の違いについては、生活環境を維持する案と、何かを変えて試す案をどちらも並べてみます。移動できるかどうかと希望するかどうかは分けて考えます。相談と自分で決める範囲は、同じ暫定ラベルの二人でも毎回確認する必要があります。"},{"id":"scenario","title":"03｜具体的な場面で考える","body":"「一つの研究テーマを時間をかけて調べる」案と「長期目標に向けて方法を見直す」案を、公開読書会の中で並べてみます。読む対象の幅と一冊を深く読む時間を整理することが第一歩です。担当をタイプ名で決めず、実際に興味がある作業を各自が選び直せるようにします。 一方の案だけを採用する必要はなく、最初の一回で試す内容と長期的に続けたい内容を分けられます。"},{"id":"dilemma","title":"04｜考え方が食い違ったとき","body":"一つの研究テーマを時間をかけて調べる案を先に試すか、長期目標に向けて方法を見直す案を先に試すかは、タイプから決められません。判断に必要な費用・日程・参加条件を並べ、合意できない点は保留する方法もあります。 共通ラベルがあっても実際の希望は確かめる必要があります。"},{"id":"questions","title":"05｜ふたりで話してみたい3つの質問","questions":["「一つの研究テーマを時間をかけて調べる」案と「長期目標に向けて方法を見直す」案なら、公開読書会で最初にどちらを試したいですか。","公開読書会を進める場合、「静かな探究者」側と「変革の探究者」側はそれぞれどの生活上の条件を維持し、どこなら変更を試したいですか。","「研究の対象を絞る」希望と「目標につながる手順を探す」希望を両方取り入れるには、どんな順番や役割が考えられますか。"]},{"id":"usage","title":"06｜この比較の使い方","body":"設定上の一致数や相違数は相性点ではありません。異なる意見を無理に一致させず、実際に何を大切にしたいか確かめるために使ってください。"}],"disclaimer":"これは暫定16キャラクターの設定を比較する編集用ガイドです。実際の人の性格・適性・相性の良否・関係の将来を判定しません。B軸を含む分類は未検証で、判断するときは本人の希望と事情を優先してください。","authoring":"AI_PHASE1_EDITORIAL_DRAFT","humanReviewed":false,"independentReviewed":false,"ownerApprovedForPublication":false,"scientificValidated":false,"production":false},{"pairId":"T02-T11","typeIds":["T02","T11"],"typeNames":["静かな探究者","自由な冒険者"],"formatVersion":"A05-PHASE1-SHORT-1.0.0-draft","sameType":false,"structuralSharedAxisCount":1,"structuralDifferentAxisCount":3,"axisComparison":[{"axis":"A","label":"生活環境","first":"安定寄り","second":"変化寄り","relation":"different"},{"axis":"B 者"],"formatVersion":"A05-PHASE1-SHORT-1.0.0-draft","sameType":false,"structuralSharedAxisCount":2,"structuralDifferentAxisCount":2,"axisComparison":[{"axis":"A","label":"生活環境","first":"安定寄り","second":"変化寄り","relation":"different"},{"axis":"B","label":"意思決定","first":"自律寄り","second":"自律寄り","relation":"shared"},{"axis":"C","label":"時間の優先","first":"将来寄り","second":"現在寄り","relation":"different"},{"axis":"D","label":"経験の幅と深さ","first":"深耕寄り","second":"深耕寄り","relation":"shared"}],"sourceStoryOrigin":"NEW_COMPOSED_PHASE1","sourceMasterOriginalCopy":"たとえば、「関心のある分野を継続して学ぶ」と「制作や学習にじっくり取り組む」をそれぞれ考えます。どちらか一方を選ぶ必要はなく、実際の希望や使える時間は人によって異なります。設定上の相違の一つは「生活環境を変えるか維持するか」です。一方のラベルは「安定」、他方は「変化」ですが、住む環境は維持しつつ、新しい活動を試すという選択も考えられます。共通する暫定ラベルは「自律」です。ただし、意思決定の進め方について考える場合も、具体的な希望が一致するとは限りません。","context":"小さな制作会","sections":[{"id":"shared","title":"01｜共通する視点","body":"「静かな探究者」は「自分のペースで長期目標を深める」、「自由な求道者」は「自由な環境で情熱を深める」という暫定的な編集設定です。設定上、意思決定・経験の幅と深さの2軸は共通します。一方、同じラベルでも経験・希望・使える時間まで同じと決めるものではありません。"},{"id":"different","title":"02｜違いから見えてくる問い","body":"A軸の違いについては、生活環境を維持する案と、何かを変えて試す案をどちらも並べてみます。移動できるかどうかと希望するかどうかは分けて考えます。今この活動で得たい充実と、半年後に残したい成果を別々に書き出せます。どちらかが正しいという評価はしません。"},{"id":"scenario","title":"03｜具体的な場面で考える","body":"仮に小さな制作会を一緒に考える場面で、「研究の対象を絞る」ことと「集中できる時間と場所を作る」ことを同じ計画に入れてみます。一つの研究テーマを時間をかけて調べる選択と変化のある環境で一つの制作に集中する選択は、順序や時間を分ければ共存し得ます。 各自の経験や役割をタイプの名前から推定せず、どの工程なら引き受けたいかを直接尋ねられます。"},{"id":"dilemma","title":"04｜考え方が食い違ったとき","body":"「研究の対象を絞る」ことと「集中できる時間と場所を作る」ことのどちらから進めるかで意見が違うかもしれません。その場合は、小さな制作会で先に決める必要があることと、後から変更できることを分けてみます。 今回の楽しみと半年後の成果を二つの目標として置く方法もあります。"},{"id":"questions","title":"05｜ふたりで話してみたい3つの質問","questions":["「一つの研究テーマを時間をかけて調べる」案と「変化のある環境で一つの制作に集中する」案なら、小さな制作会で最初にどちらを試したいですか。","小さな制作会を進める場合、「静かな探究者」側と「自由な求道者」側はそれぞれどの生活上の条件を維持し、どこなら変更を試したいですか。","「研究の対象を絞る」希望と「集中できる時間と場所を作る」希望を両方取り入れるには、どんな順番や役割が考えられますか。"]},{"id":"usage","title":"06｜この比較の使い方","body":"設定上の一致数や相違数は相性点ではありません。異なる意見を無理に一致させず、実際に何を大切にしたいか確かめるために使ってください。"}],"disclaimer":"これは暫定16キャラクターの設定を比較する編集用ガイドです。実際の人の性格・適性・相性の良否・関係の将来を判定しません。B軸を含む分類は未検証で、判断するときは本人の希望と事情を優先してください。","authoring":"AI_PHASE1_EDITORIAL_DRAFT","humanReviewed":false,"independentReviewed":false,"ownerApprovedForPublication":false,"scientificValidated":false,"production":false},{"pairId":"T03-T04","typeIds":["T03","T04"],"typeNames":["マイペースな発見家","暮らしの職人"],"formatVersion":"A05-PHASE1-SHORT-1.0.0-draft","sameType":false,"structuralSharedAxisCount":3,"structuralDifferentAxisCount":1,"axisComparison":[{"axis":"A","label":"生活環境","first":"安定寄り","second":"安定寄り","relation":"shared"},{"axis":"B","label":"意思決定","first":"自律寄り","second":"自律寄り","relation":"shared"},{"axis":"C","label":"時間の優先","first":"現在寄り","second":"現在寄り","relation":"shared"},{"axis":"D","label":"経験の幅と深さ","first":"探索寄り","second":"深耕寄り","relation":"different"}],"sourceStoryOrigin":"NEW_COMPOSED_PHASE1","sourceMasterOriginalCopy":"たとえば、「日常に小さな体験を加える」と「好きな活動を続ける」をそれぞれ考えます。どちらか一方を選ぶ必要はなく、実際の希望や使える時間は人によって異なります。設定上の相違の一つは「経験を広げることと一つを深めること」です。一方のラベルは「探索」、他方は「深耕」ですが、広く試す分野と深く続ける分野は同じ人の中にもあり得ます。共通する暫定ラベルは「安定」です。ただし、安心できる生活基盤について考える場合も、具体的な希望が一致するとは限りません。","context":"学びの共有発表会","sections":[{"id":"shared","title":"01｜共通する視点","body":"「マイペースな発見家」は「落ち着いた暮らしで多様な体験を楽しむ」、「暮らしの職人」は「好きなことを日々丁寧に育てる」という暫定的な編集設定です。設定上、生活環境・意思決定・時間の優先の3軸は共通します。一方、同じラベルでも経験・希望・使える時間まで同じと決めるものではありません。"},{"id":"different","title":"02｜違いから見えてくる問い","body":"D軸の違いについては、多くのことを一度試す時間と、好きな一つを深める時間を区別します。同じ人が場面に応じて両方を使い分けることもあります。現在の活動環境について共通するラベルでも、残したい場所や習慣は違う可能性があります。"},{"id":"scenario","title":"03｜具体的な場面で考える","body":"学びの共有発表会を検討するなら、一方に「身近な場所で初めての体験を探す」、もう一方に「好きな活動の工程を丁寧に磨く」という活動例を置けます。両方の活動を一人で行う場合もあるため、役割の割当ではなく希望を整理する資料として使います。自分の学びをまとめる時間と他者の発表を聞く時間を分ける方法も考えられます。 準備の負担が大きい場合は、今ある場所や道具を活かした小規模な試行に置き換えることもできます。"},{"id":"dilemma","title":"04｜考え方が食い違ったとき","body":"学びの共有発表会への関わり方が一致しない場合も、相手の性格が原因と決める必要はありません。身近な体験を組み合わせる希望と習慣を無理なく続ける希望を別々に聞き、どちらも無理のない小さな案を作ります。 試す活動の幅と一つに集中する時間は両方確保できます。"},{"id":"questions","title":"05｜ふたりで話してみたい3つの質問","questions":["「身近な場所で初めての体験を探す」案と「好きな活動の工程を丁寧に磨く」案なら、学びの共有発表会で最初にどちらを試し する案と、何かを変えて試す案をどちらも並べてみます。移動できるかどうかと希望するかどうかは分けて考えます。今この活動で得たい充実と、半年後に残したい成果を別々に書き出せます。どちらかが正しいという評価はしません。残る1軸の相違も、実際の行動を決めつけず話し合う材料にします。"},{"id":"scenario","title":"03｜具体的な場面で考える","body":"地域の広報企画の企画なら、「身近な場所で初めての体験を探す」案と「長期目標に向けて方法を見直す」案を先に別々に出せます。誰に何を伝えるかと、どこまで変えるかを相談するためには、できる条件とやりたい条件を混同せず、一度だけ試す選択肢を残します。 この二つの案に優劣を付ける必要はありません。実際に使える時間や費用が違えば、実行できる順番も変わります。"},{"id":"dilemma","title":"04｜考え方が食い違ったとき","body":"地域の広報企画への関わり方が一致しない場合も、相手の性格が原因と決める必要はありません。身近な体験を組み合わせる希望と目標につながる手順を探す希望を別々に聞き、どちらも無理のない小さな案を作ります。 今回の楽しみと半年後の成果を二つの目標として置く方法もあります。"},{"id":"questions","title":"05｜ふたりで話してみたい3つの質問","questions":["「身近な場所で初めての体験を探す」案と「長期目標に向けて方法を見直す」案なら、地域の広報企画で最初にどちらを試したいですか。","地域の広報企画を進める場合、「マイペースな発見家」側と「変革の探究者」側はそれぞれどの生活上の条件を維持し、どこなら変更を試したいですか。","「身近な体験を組み合わせる」希望と「目標につながる手順を探す」希望を両方取り入れるには、どんな順番や役割が考えられますか。"]},{"id":"usage","title":"06｜この比較の使い方","body":"設定上の一致数や相違数は相性点ではありません。異なる意見を無理に一致させず、実際に何を大切にしたいか確かめるために使ってください。"}],"disclaimer":"これは暫定16キャラクターの設定を比較する編集用ガイドです。実際の人の性格・適性・相性の良否・関係の将来を判定しません。B軸を含む分類は未検証で、判断するときは本人の希望と事情を優先してください。","authoring":"AI_PHASE1_EDITORIAL_DRAFT","humanReviewed":false,"independentReviewed":false,"ownerApprovedForPublication":false,"scientificValidated":false,"production":false},{"pairId":"T03-T11","typeIds":["T03","T11"],"typeNames":["マイペースな発見家","自由な冒険者"],"formatVersion":"A05-PHASE1-SHORT-1.0.0-draft","sameType":false,"structuralSharedAxisCount":3,"structuralDifferentAxisCount":1,"axisComparison":[{"axis":"A","label":"生活環境","first":"安定寄り","second":"変化寄り","relation":"different"},{"axis":"B","label":"意思決定","first":"自律寄り","second":"自律寄り","relation":"shared"},{"axis":"C","label":"時間の優先","first":"現在寄り","second":"現在寄り","relation":"shared"},{"axis":"D","label":"経験の幅と深さ","first":"探索寄り","second":"探索寄り","relation":"shared"}],"sourceStoryOrigin":"NEW_COMPOSED_PHASE1","sourceMasterOriginalCopy":"たとえば、「日常に小さな体験を加える」と「新しい活動を自分で選ぶ」をそれぞれ考えます。どちらか一方を選ぶ必要はなく、実際の希望や使える時間は人によって異なります。設定上の相違の一つは「生活環境を変えるか維持するか」です。一方のラベルは「安定」、他方は「変化」ですが、住む環境は維持しつつ、新しい活動を試すという選択も考えられます。共通す sourceMasterOriginalCopy":"たとえば、「身近な人と新しい体験を探す」と「仲間と長期目標に取り組む」をそれぞれ考えます。どちらか一方を選ぶ必要はなく、実際の希望や使える時間は人によって異なります。設定上の相違の一つは「生活環境を変えるか維持するか」です。一方のラベルは「安定」、他方は「変化」ですが、住む環境は維持しつつ、新しい活動を試すという選択も考えられます。共通する暫定ラベルは「つながり」です。ただし、意思決定の進め方について考える場合も、具体的な希望が一致するとは限りません。","context":"地域の広報企画","sections":[{"id":"shared","title":"01｜共通する視点","body":"「日常の発見家」は「身近な人と日々の発見を楽しむ」、「理想を育てる共創者」は「仲間と長期的な理想を形にする」という暫定的な編集設定です。設定上、意思決定の1軸は共通します。一方、同じラベルでも経験・希望・使える時間まで同じと決めるものではありません。"},{"id":"different","title":"02｜違いから見えてくる問い","body":"A軸の違いについては、生活環境を維持する案と、何かを変えて試す案をどちらも並べてみます。移動できるかどうかと希望するかどうかは分けて考えます。今この活動で得たい充実と、半年後に残したい成果を別々に書き出せます。どちらかが正しいという評価はしません。残る1軸の相違も、実際の行動を決めつけず話し合う材料にします。"},{"id":"scenario","title":"03｜具体的な場面で考える","body":"地域の広報企画の企画なら、「身近な人と新しい発見を楽しむ」案と「仲間と一つの長期目標を形にする」案を先に別々に出せます。誰に何を伝えるかと、どこまで変えるかを相談するためには、できる条件とやりたい条件を混同せず、一度だけ試す選択肢を残します。 この二つの案に優劣を付ける必要はありません。実際に使える時間や費用が違えば、実行できる順番も変わります。"},{"id":"dilemma","title":"04｜考え方が食い違ったとき","body":"地域の広報企画への関わり方が一致しない場合も、相手の性格が原因と決める必要はありません。日常に新しい遊びを加える希望と共同制作の長い見通しを持つ希望を別々に聞き、どちらも無理のない小さな案を作ります。 今回の楽しみと半年後の成果を二つの目標として置く方法もあります。"},{"id":"questions","title":"05｜ふたりで話してみたい3つの質問","questions":["「身近な人と新しい発見を楽しむ」案と「仲間と一つの長期目標を形にする」案なら、地域の広報企画で最初にどちらを試したいですか。","地域の広報企画を進める場合、「日常の発見家」側と「理想を育てる共創者」側はそれぞれどの生活上の条件を維持し、どこなら変更を試したいですか。","「日常に新しい遊びを加える」希望と「共同制作の長い見通しを持つ」希望を両方取り入れるには、どんな順番や役割が考えられますか。"]},{"id":"usage","title":"06｜この比較の使い方","body":"設定上の一致数や相違数は相性点ではありません。異なる意見を無理に一致させず、実際に何を大切にしたいか確かめるために使ってください。"}],"disclaimer":"これは暫定16キャラクターの設定を比較する編集用ガイドです。実際の人の性格・適性・相性の良否・関係の将来を判定しません。B軸を含む分類は未検証で、判断するときは本人の希望と事情を優先してください。","authoring":"AI_PHASE1_EDITORIAL_DRAFT","humanReviewed":false,"independentReviewed":false,"ownerApprovedForPublication":false,"scientificValidated":false,"production":false},{"pairId":"T07-T15","typeIds":["T07","T15"],"typeNames":["日常の発見家","出会いを楽しむ旅人"],"formatVersion":"A05-PHASE1-SHORT-1.0.0-draft","sameType":false,"structuralSharedAxisCount":3,"structuralDifferentAxisCount":1,"axisComparison":[{"axis":"A","label":"生活環境","first":"安定寄り","second":"変化寄り","relation":"different"},{"axis":"B","label":"意思決定","first":"つながり寄り","second":"つながり寄り","relation":"shared"},{"axis":"C","label":"時間の優先","first":"現在寄り","second":"現在寄り","relation":"shared"},{"axis":"D","label":"経験の幅と深さ","first":"探索寄り","second":"探索寄り","relation":"shared"}],"sourceStoryOrigin":"P3_HIGH_REPEAT_NEXT8_20261104","sourceMasterOriginalCopy":"たとえば、「身近な人と新しい体験を探す」と「初めての交流や体験を検討する」をそれぞれ考えます。どちらか一方を選ぶ必要はなく、実際の希望や使える時間は人によって異なります。設定上の相違の一つは「生活環境を変えるか維持するか」です。一方のラベルは「安定」、他方は「変化」ですが、住む環境は維持しつつ、新しい活動を試すという選択も考えられます。共通する暫定ラベルは「つながり」です。ただし、意思決定の進め方について考える場合も、具体的な希望が一致するとは限りません。","context":"月一回の交流会","sections":[{"id":"shared","title":"01｜共通する視点","body":"「日常の発見家」は「身近な人と日々の発見を楽しむ」、「出会いを楽しむ旅人」は「人との出会いと新しい経験を楽しむ」という暫定的な編集設定です。設定上、意思決定・時間の優先・経験の幅と深さの3軸は共通します。一方、同じラベルでも経験・希望・使える時間まで同じと決めるものではありません。"},{"id":"different","title":"02｜違いから見えてくる問い","body":"A軸の違いについては、生活環境を維持する案と、何かを変えて試す案をどちらも並べてみます。移動できるかどうかと希望するかどうかは分けて考えます。相談と自分で決める範囲は、同じ暫定ラベルの二人でも毎回確認する必要があります。"},{"id":"scenario","title":"03｜具体的な場面で考える","body":"街の散策企画で、よく知る地域の小さな発見を集める方法と、別の場所で新しい人に会う方法を考えます。「日常の発見家」と「出会いを楽しむ旅人」は人との関わり、今の充実、幅広い体験という暫定ラベルが共通します。一方、慣れた環境を活かすか変化を加えるかは別の選択です。移動の費用や体力なども考え、近場だけで行う案を含めて話し合います。"},{"id":"dilemma","title":"04｜考え方が食い違ったとき","body":"身近な人と新しい発見を楽しむ案を先に試すか、新しい出会いから活動の幅を広げる案を先に試すかは、タイプから決められません。判断に必要な費用・日程・参加条件を並べ、合意できない点は保留する方法もあります。 共通ラベルがあっても実際の希望は確かめる必要があります。"},{"id":"questions","title":"05｜ふたりで話してみたい3つの質問","questions":["同じ地域を歩いて新たに気づけそうなことは何ですか。","遠出が難しい参加者にも開かれた企画にするなら、場所や内容をどう選びますか。","初めて会う人との交流と、いつもの仲間との活動の時間をどう配分したいですか。"]},{"id":"usage","title":"06｜この比較の使い方","body":"設定上の一致数や相違数は相性点ではありません。異なる意見を無理に一致させず、実際に何を大切にしたいか確かめるために使ってください。"}],"disclaimer":"これは暫定16キャラクターの設定を比較する編集用ガイドです。実際の人の性格・適性・相性の良否・関係の将来を判定しません。B軸を含む分類は未検証で、判断するときは本人の希望と事情を優先してください。","authoring":"AI_PHASE1_EDITORIAL_DRAFT","humanReviewed":false,"independentReviewed":false,"ownerApprovedForPublication":false,"scientificValidated":false,"production":false},{"pairId":"T07-T16","typeIds":["T07","T16" const ids=new Map(SELF.map((x,i)=>[x.typeId,i]));
const pairs=new Map(PAIRS.map(x=>[x.pairId,x]));
const $=id=>document.getElementById(id);
const toText=(parent,tag,value,className)=>{const node=document.createElement(tag);node.textContent=value;if(className)node.className=className;parent.append(node);return node;};
function pairsKey(a,b){return [a,b].sort().join("-");}
function fillSelect(el){for(const type of SELF){const option=document.createElement("option");option.value=type.typeId;option.textContent=type.typeId+"｜"+type.name;el.append(option);}}
fillSelect($("first"));fillSelect($("second"));$("first").value="T01";$("second").value="T05";
let mode="self";
function render(){
 const target=$("result");target.replaceChildren();
 const a=$("first").value,b=$("second").value;
 let data=mode==="self"?SELF[ids.get(a)]:pairs.get(pairsKey(a,b));
 if(!data){toText(target,"p","レポートが見つかりません。");return;}
 const pairReversed=mode==="pair" && a!==data.typeIds[0];
 const displayNames=mode==="pair"?[SELF[ids.get(a)].name,SELF[ids.get(b)].name]:null;
 const header=document.createElement("section");header.className="report-head";
 toText(header,"p",mode==="self"?"SELF-REFLECTION / 16 TYPES":"VALUE CONVERSATION / 136 PAIRS","kicker");
 if(mode==="self"){
  toText(header,"h2",data.emoji+" "+data.typeId+"｜"+data.name);
  toText(header,"p","「"+data.tagline+"」","tagline");
  toText(header,"p",data.shortSummary,"subtitle");
 }else{
  toText(header,"h2",displayNames[0]+" × "+displayNames[1]);
  const line=document.createElement("p");line.className="subtitle";
  toText(line,"span","共通 "+data.structuralSharedAxisCount+"軸","count");
  toText(line,"span","相違 "+data.structuralDifferentAxisCount+"軸","count");
  header.append(line);
 }
 target.append(header);
 if(mode==="pair"){
  const ap=document.createElement("section");ap.className="axis-panel";
  toText(ap,"h3","4軸の設定上の比較");
  const table=document.createElement("table");table.className="axis-table";const row=document.createElement("tr");
  for(const h of ["観点",displayNames[0],displayNames[1]])toText(row,"th",h);
  const head=document.createElement("thead");head.append(row);table.append(head);
  const body=document.createElement("tbody");
  for(const ax of data.axisComparison){const tr=document.createElement("tr");
   for(const v of [ax.label+"（"+(ax.relation==="shared"?"共通":"相違")+"）",pairReversed?ax.second:ax.first,pairReversed?ax.first:ax.second])toText(tr,"td",v);
   body.append(tr);
  }table.append(body);ap.append(table);target.append(ap);
 }
 for(const s of data.sections){
  const box=document.createElement("section");box.className="section";
  toText(box,"h3",s.title);
  if(s.body)toText(box,"p",s.body);
  if(s.items){const grid=document.createElement("div");grid.className="axis-grid";
   for(const x of s.items){const cell=document.createElement("div");cell.className="axis";
    toText(cell,"strong",x.axis+"｜"+x.label+"： "+x.orientation);
    toText(cell,"small",x.text);grid.append(cell);
   }box.append(grid);
  }
  if(s.questions){const list=document.createElement("ol");list.className="prompts";
   for(const q of s.questions)toText(list,"li",q);box.append(list);
  }
  if(s.closing)toText(box,"p",s.closing);
  target.append(box);
 }
 const footer=document.createElement("div");footer.className="notice";footer.setAttribute("role","note");footer.textContent=data.disclaimer;target.append(footer);
}
function setMode(next){mode=next;$("tab-self").setAttribute("aria-selected",String(mode==="self"));$("tab-pair").setAttribute("aria-selected",String(mode==="pair"));$("second-field").hidden=mode!=="pair";render();}
$("tab-self").addEventListener("click",()=>setMode("self"));
$("tab-pair").addEventListener("click",()=>setMode("pair"));

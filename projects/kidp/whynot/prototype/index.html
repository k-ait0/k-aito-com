<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="KIDP-002 WHYNOTのConcept Prototypeデモ"><meta name="robots" content="noindex,nofollow"><title>WHYNOT — KIDP-002 Concept Prototype</title><style>
:root{--ink:#10233d;--muted:#667085;--green:#1e6757;--soft:#eaf4ef;--paper:#fbfaf7;--line:#e4e7ec;--gold:#a36a16}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}button,input,textarea{font:inherit}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:#fbfaf7ee;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.brand{font-weight:900;letter-spacing:.08em}.brand small{display:block;color:var(--green);font-size:8px}.badge{font-size:9px;padding:7px 9px;border-radius:99px;background:var(--soft);color:var(--green);font-weight:800}main{max-width:980px;margin:auto;padding:20px 16px 88px}.hero{padding:22px 0}.hero small,.eyebrow{font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--green)}h1{font-size:clamp(34px,7vw,62px);line-height:1.02;letter-spacing:-.05em;margin:8px 0 12px}.hero p{color:var(--muted);line-height:1.75;max-width:640px}.built{padding:20px;background:var(--ink);color:white;border-radius:20px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.built p{color:#cad4df;line-height:1.6;font-size:13px}.built strong{font-size:42px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.card{border:1px solid var(--line);background:white;border-radius:15px;padding:14px;cursor:pointer;text-align:left}.card h3{font-size:14px;line-height:1.45;margin:8px 0}.tag{font-size:8px;padding:4px 6px;border-radius:99px;background:#f2f4f7;color:#475467;font-weight:800}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.section{margin-top:28px}.section h2{font-size:19px}.chips{display:flex;gap:6px;overflow:auto}.chip{border:1px solid var(--line);background:white;padding:7px 10px;border-radius:99px;font-size:10px}.chip.on{background:var(--ink);color:white}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}.detail{max-width:720px;margin:auto}.back{border:0;background:none;color:var(--muted);padding:0 0 12px}.detail h2{font-size:30px;letter-spacing:-.035em}.samebox{display:flex;justify-content:space-between;align-items:center;padding:14px;background:var(--soft);border-radius:14px}.samebtn,.primary{border:0;background:var(--green);color:white;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fact{border:1px solid var(--line);padding:11px;border-radius:12px}.fact b{display:block;font-size:9px;color:var(--muted)}.solution{border-top:1px solid var(--line);padding:12px 0}.solution:first-child{border-top:0}.score{font-size:58px;font-weight:900;color:var(--green);letter-spacing:-.06em}.notice{font-size:10px;color:#765b1c;background:#fff8e7;padding:10px;border-radius:10px}.form label{display:block;font-size:11px;font-weight:800;margin:12px 0 5px}.form textarea,.form input{width:100%;border:1px solid #d0d5dd;background:white;border-radius:10px;padding:10px}.form textarea{min-height:90px}.queue-row{display:grid;grid-template-columns:1fr 56px 72px;gap:8px;align-items:center;padding:11px;background:white;border:1px solid var(--line);border-radius:12px;margin:7px 0}.queue-row b{text-align:right}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;border-top:1px solid var(--line)}.bottom>div{max-width:600px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav{border:0;background:none;padding:10px 3px;font-size:9px;color:var(--muted)}.nav.on{color:var(--green);font-weight:900}.hidden{display:none!important}.test-only{display:none}.test-mode .test-only{display:block}.test-shell{max-width:980px;margin:auto;padding:0 16px 100px}.test-panel{background:#f8faf8;border:1px dashed #aab6ae;border-radius:16px;padding:18px}.test-panel>strong{display:block;font-size:11px;letter-spacing:.08em}.test-panel>p{font-size:10px;line-height:1.7;color:var(--muted)}.test-panel label{display:block;font-size:9px;font-weight:800;color:var(--muted);margin:10px 0 4px}.test-panel input,.test-panel textarea,.test-panel select{width:100%;border:1px solid #d0d5dd;background:white;border-radius:8px;padding:9px;font:inherit;font-size:11px}.test-panel textarea{min-height:62px}.test-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.test-metrics div{background:white;border:1px solid var(--line);padding:9px;border-radius:9px;font-size:8px;color:var(--muted)}.test-metrics b{display:block;color:var(--ink);font-size:14px}.test-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.test-actions button{border:1px solid var(--line);background:white;padding:8px 10px;border-radius:9px;font-size:10px;cursor:pointer}.test-actions .copy-primary{background:var(--ink);color:white;border-color:var(--ink)}.copy-state{min-height:1.4em;margin-top:7px;font-size:9px;color:var(--green)}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.built{grid-template-columns:1fr}.facts{grid-template-columns:1fr}.test-metrics{grid-template-columns:1fr 1fr}}@media(max-width:460px){.grid{grid-template-columns:1fr}.detail h2{font-size:27px}.queue-row{grid-template-columns:1fr 48px}.queue-row span:last-child{grid-column:1/-1}.badge{display:none}}
</style></head><body><header class="top"><div class="brand">WHYNOT<small>KIDP-002</small></div><div class="badge">CONCEPT PROTOTYPE</div></header><main id="app"></main><div class="test-only test-shell"><section class="test-panel"><strong>USER TEST MODE</strong><p>操作ログはこの端末内だけに保存します。テスト後に観察結果を入力し、CSVまたはJSONをコピーしてください。</p><label for="participantId">Participant ID</label><input id="participantId" placeholder="P01"><div class="test-metrics"><div>Problems viewed<b id="mViewed">0</b></div><div>SAME clicks<b id="mSame">0</b></div><div>Submit opened<b id="mSubmit">NO</b></div><div>Draft chars<b id="mDraft">0</b></div></div><label for="problemFirstInput">Problemを先に集め、Solutionは後で考える仕組みだと理解した</label><select id="problemFirstInput"><option value="">未記録</option><option value="yes">YES</option><option value="no">NO</option><option value="unclear">UNCLEAR</option></select><label for="wantsSubmitInput">自分のProblemも投稿したい</label><select id="wantsSubmitInput"><option value="">未記録</option><option value="yes">YES</option><option value="no">NO</option><option value="unclear">UNCLEAR</option></select><label for="likeMisreadInput">SAMEをLike / 面白い投票だと思った</label><select id="likeMisreadInput"><option value="">未記録</option><option value="no">NO</option><option value="yes">YES</option><option value="unclear">UNCLEAR</option></select><label for="firstQuote">第一声</label><textarea id="firstQuote"></textarea><label for="confusing">分かりにくかった点</label><textarea id="confusing"></textarea><label for="missing">追加してほしいもの</label><textarea id="missing"></textarea><div class="test-actions"><button class="copy-primary" id="copyCsvBtn">CSV行をコピー</button><button id="copyJsonBtn">JSONをコピー</button></div><div id="copyState" class="copy-state"></div></section></div><nav class="bottom"><div><button class="nav on" data-page="home">Home</button><button class="nav" data-page="explore">Explore</button><button class="nav" data-page="submit">＋Problem</button><button class="nav" data-page="build">Build</button></div></nav><script>
const P=[
["P001","クーポンを使わず失効してしまう","MONEY",318,92,"BUILT"],["P002","飲食店の閉店作業に毎日45分かかる","WORK",128,87,"BUILD"],["P003","賃貸情報だけでは、その街での生活が想像できない","CITY",243,92,"PRIORITY"],["P004","高齢者のスマホ設定が結局家族頼み","DIGITAL",186,85,"BUILD"],["P005","会議の議事録を誰も読み返さない","WORK",154,73,"DESIGN"],["P006","冷蔵庫の食材を使い切れない","LIFE",211,80,"PROTOTYPE"],["P007","旅行の荷造りで毎回何か忘れる","LIFE",97,75,"PROTOTYPE"],["P008","引き継ぎ資料の場所が分からない","WORK",172,74,"DESIGN"],["P009","新人教育を毎回同じ人がしている","WORK",119,71,"DESIGN"],["P010","宅配便を受け取る時間を気にする","LIFE",134,68,"DESIGN"],["P011","家電の説明書をなくす","LIFE",88,58,"ARCHIVE"],["P012","サブスクを契約したことを忘れる","MONEY",276,78,"PROTOTYPE"],["P013","保険を比較しても自分に必要か分からない","MONEY",201,72,"DESIGN"],["P014","税制優遇制度が複雑で、自分が使えるものが分からない","MONEY",305,81,"PROTOTYPE"],["P015","パスワード管理が面倒","DIGITAL",332,54,"ARCHIVE"],["P016","写真が増えすぎて整理できない","DIGITAL",248,69,"DESIGN"],["P017","飲食店選びに時間がかかる","FOOD",289,70,"DESIGN"],["P018","買った食材から献立を決められない","FOOD",194,72,"DESIGN"],["P019","駅徒歩10分が実際どの程度つらいのか分からない","CITY",142,79,"PROTOTYPE"],["P020","引越し先の夜の雰囲気が分からない","CITY",167,82,"PROTOTYPE"]];
const params=new URLSearchParams(location.search),testMode=params.get("test")==="1",pidFromUrl=params.get("pid")||"";
if(testMode)document.body.classList.add("test-mode");
const sameKey=testMode?"whynot.same.test."+encodeURIComponent(pidFromUrl||"anonymous"):"whynot.same";
let sameIds=new Set(JSON.parse(localStorage.getItem(sameKey)||"[]")),page="home",filter="ALL";
let problemsViewed=[],sameClicks=0,submitOpened=false,draftText="",structureClicked=false,exploreOpened=false,buildOpened=false;
if(testMode&&pidFromUrl)document.querySelector("#participantId").value=pidFromUrl;
const app=document.querySelector("#app");
const card=p=>'<button class="card" onclick="detail(\''+p[0]+'\')"><span class="tag">'+p[2]+'</span><h3>'+p[1]+'</h3><div class="meta"><span>SAME '+(p[3]+(sameIds.has(p[0])?1:0))+'</span><b>'+p[4]+' / '+p[5]+'</b></div></button>';
function nav(n){page=n;if(testMode){if(n==="explore")exploreOpened=true;if(n==="submit")submitOpened=true;if(n==="build")buildOpened=true;saveTest();renderTestMetrics()}document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("on",x.dataset.page===n));render()}
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>nav(b.dataset.page));
function render(){if(page==="home")home();else if(page==="explore")explore();else if(page==="submit")submit();else build()}
function home(){app.innerHTML='<section class="hero"><small>PROBLEM-FIRST IDEA DISCOVERY</small><h1>世の中の「これ面倒」を集める。</h1><p>Solutionを考える前にProblemを資産化する。SAMEで重なりを見つけ、AIで整理し、次に本気で作る題材へつなぐ。</p><button class="primary" onclick="nav(\'submit\')">＋ Problemを投稿</button></section><section class="built"><div><span class="eyebrow">BUILT FROM A PROBLEM</span><h2>クーポンを使わず失効してしまう</h2><p>このProblemからKIDP-001 Project GIVEを設計・Prototype化した。</p></div><strong>92</strong></section><section class="section"><h2>Trending Problems</h2><div class="grid">'+P.slice(0,9).map(card).join("")+'</div></section>'}
function explore(){const cats=["ALL","WORK","LIFE","CITY","MONEY","DIGITAL","FOOD"];const list=filter==="ALL"?P:P.filter(x=>x[2]===filter);app.innerHTML='<section class="hero"><small>EXPLORE</small><h1>Problemを眺める。</h1></section><div class="chips">'+cats.map(x=>'<button class="chip '+(x===filter?"on":"")+'" onclick="filter=\''+x+'\';explore()">'+x+'</button>').join("")+'</div><div class="grid">'+list.map(card).join("")+'</div>'}
function detail(id){const p=P.find(x=>x[0]===id);page="detail";if(testMode&&!problemsViewed.includes(id)){problemsViewed.push(id);saveTest();renderTestMetrics()}document.querySelectorAll(".nav").forEach(x=>x.classList.remove("on"));if(id==="P001"){app.innerHTML='<div class="detail"><button class="back" onclick="nav(\'home\')">← Home</button><span class="tag">BUILT · KIDP-001</span><h2>'+p[1]+'</h2><div class="panel"><span class="eyebrow">FROM PROBLEM TO BUILD</span><h3>Project GIVE</h3><p>余った価値をGiveし、役立つほどContributionとCreditが増える。貢献した人ほど次のGIVEへ早くアクセスできる。</p><div class="score">92</div><small>BUILD SCORE · NOT BUSINESS VALUE</small></div></div>';return}
const sameOn=sameIds.has(id),sameBox='<div class="samebox"><div><b>私にもこのProblemがある</b><br><small>SAME '+(p[3]+(sameOn?1:0))+'</small></div><button class="samebtn" onclick="toggleSame(\''+id+'\')">'+(sameOn?"SAME ✓":"SAME")+'</button></div>';
if(id==="P002"){app.innerHTML='<div class="detail"><button class="back" onclick="nav(\'explore\')">← Explore</button><span class="tag">'+p[2]+' · '+p[5]+'</span><h2>'+p[1]+'</h2>'+sameBox+'<div class="facts"><div class="fact"><b>WHO</b>飲食店スタッフ / 店長</div><div class="fact"><b>FREQUENCY</b>Daily</div><div class="fact"><b>PAIN</b>退勤遅延 / 人件費</div></div><div class="panel"><span class="eyebrow">AI PROBLEM ANALYSIS</span><h3>なぜまだ残っている？</h3><ul><li>店舗ごとに作業内容が違う</li><li>物理作業とデジタル作業が混在</li><li>小規模店では専用システムのROIが出にくい</li></ul><div class="notice">AIによる仮説です。市場調査・ユーザー調査は未実施です。</div></div><div class="panel"><span class="eyebrow">SOLUTION LAB</span><h3>同じProblemを3方向から解く</h3><div class="solution"><b>CloseFlow</b><p>閉店業務専用Workflow SaaS。</p></div><div class="solution"><b>Closing Kit</b><p>QRチェック＋物理ツール。</p></div><div class="solution"><b>NightOps</b><p>レジ・在庫・日報を遠隔確認するBPO。</p></div></div><div class="panel"><span class="eyebrow">BUILD SCORE · NOT BUSINESS VALUE</span><div class="score">87</div><p>Kaitoで設計・Prototype化する制作適性。事業価値・市場規模・成功確率ではない。</p></div></div>';return}
app.innerHTML='<div class="detail"><button class="back" onclick="nav(\'explore\')">← Explore</button><span class="tag">'+p[2]+' · '+p[5]+'</span><h2>'+p[1]+'</h2>'+sameBox+'<div class="panel"><span class="eyebrow">PROBLEM DETAIL · P0</span><h3>詳細仮説はまだ固定しない。</h3><p>このProblemのWHO / FREQUENCY / PAINは未調査です。P0では「もっとProblemを見たいか」「自分にもあるProblemへSAMEするか」を先に検証します。</p><div class="notice">未検証のProblemに、別Problemの分析結果を流用しません。</div></div></div>'}
function toggleSame(id){if(sameIds.has(id))sameIds.delete(id);else sameIds.add(id);if(testMode)sameClicks++;localStorage.setItem(sameKey,JSON.stringify([...sameIds]));if(testMode){saveTest();renderTestMetrics()}detail(id)}
function submit(){app.innerHTML='<section class="hero"><small>SUBMIT A PROBLEM</small><h1>まだ、解決策は書かない。</h1></section><div class="panel form"><label>日常の「これ面倒」</label><textarea id="raw" oninput="trackRaw(this.value)" placeholder="例：閉店作業で帰るのが遅くなる"></textarea><label>誰が困る？</label><input placeholder="飲食店スタッフ / 店長"><button class="primary" style="margin-top:14px" onclick="structure()">Problemとして整理する</button><div id="ai"></div></div>';if(testMode&&draftText)document.querySelector("#raw").value=draftText}
function trackRaw(v){if(!testMode)return;draftText=v;saveTest();renderTestMetrics()}
function structure(){if(testMode){structureClicked=true;draftText=document.querySelector("#raw")?.value||draftText;saveTest();renderTestMetrics()}document.querySelector("#ai").innerHTML='<div class="panel"><span class="eyebrow">AI STRUCTURING DEMO</span><p><b>PROBLEM</b><br>飲食店では営業終了後の閉店作業に毎日30〜60分程度かかる。</p><p><b>WHO</b><br>飲食店スタッフ / 店長</p><p><b>WHEN</b><br>営業終了後</p><p><b>PAIN</b><br>退勤遅延 / 人件費 / 作業漏れ / 管理負担</p><div class="notice">固定Demoです。実AIには接続していません。</div><button class="primary" style="margin-top:12px" onclick="detail(\'P002\')">登録して見る</button></div>'}
function build(){const list=[...P].sort((a,b)=>b[4]-a[4]);app.innerHTML='<section class="hero"><small>BUILD QUEUE</small><h1>次に何を作る？</h1><p>Build Scoreは事業性ではなく、Kaitoで作る題材としての制作適性。</p></section>'+list.map((p,i)=>'<div class="queue-row" onclick="detail(\''+p[0]+'\')"><span>#'+String(i+1).padStart(2,"0")+' '+p[1]+'</span><b>'+p[4]+'</b><span>'+p[5]+'</span></div>').join("")}
function testKey(){return "kidp002.p0.test."+encodeURIComponent((document.querySelector("#participantId")?.value||pidFromUrl||"anonymous").trim())}
function saveTest(){if(!testMode)return;localStorage.setItem(testKey(),JSON.stringify({problemsViewed,sameClicks,submitOpened,draftText,structureClicked,exploreOpened,buildOpened,page,sameIds:[...sameIds]}))}
function loadTest(){if(!testMode)return;try{const x=JSON.parse(localStorage.getItem(testKey())||"{}");if(Array.isArray(x.problemsViewed))problemsViewed=x.problemsViewed;if(Number.isFinite(x.sameClicks))sameClicks=x.sameClicks;submitOpened=Boolean(x.submitOpened);draftText=x.draftText||"";structureClicked=Boolean(x.structureClicked);exploreOpened=Boolean(x.exploreOpened);buildOpened=Boolean(x.buildOpened);if(Array.isArray(x.sameIds)){sameIds=new Set(x.sameIds);localStorage.setItem(sameKey,JSON.stringify([...sameIds]))}}catch{}}
function renderTestMetrics(){if(!testMode)return;document.querySelector("#mViewed").textContent=problemsViewed.length;document.querySelector("#mSame").textContent=sameClicks;document.querySelector("#mSubmit").textContent=submitOpened?"YES":"NO";document.querySelector("#mDraft").textContent=draftText.trim().length}
function testPayload(){return {participant_id:(document.querySelector("#participantId")?.value||pidFromUrl||"").trim(),device:innerWidth<=700?"mobile":"desktop",problem_first_understood:document.querySelector("#problemFirstInput")?.value||"",wants_submit:document.querySelector("#wantsSubmitInput")?.value||"",same_like_misread:document.querySelector("#likeMisreadInput")?.value||"",first_quote:(document.querySelector("#firstQuote")?.value||"").trim(),confusing:(document.querySelector("#confusing")?.value||"").trim(),missing:(document.querySelector("#missing")?.value||"").trim(),verbatim_quote:"",problems_viewed:problemsViewed,same_clicks:sameClicks,submit_opened:submitOpened,draft_chars:draftText.trim().length,structure_clicked:structureClicked,explore_opened:exploreOpened,build_opened:buildOpened,final_page:page}}
function csvCell(v){const s=typeof v==="object"&&v!==null?JSON.stringify(v):String(v??"");return '"'+s.replaceAll('"','""')+'"'}
function testCsv(){const x=testPayload();return [x.participant_id,x.device,x.problem_first_understood,x.wants_submit,x.same_like_misread,x.first_quote,x.confusing,x.missing,x.verbatim_quote,x.problems_viewed,x.same_clicks,x.submit_opened,x.draft_chars,x.structure_clicked,x.explore_opened,x.build_opened,x.final_page].map(csvCell).join(",")}
async function copyText(t,label){try{await navigator.clipboard.writeText(t);document.querySelector("#copyState").textContent=label+"をコピーしました。"}catch{document.querySelector("#copyState").textContent="コピーできませんでした。"}}
document.querySelector("#copyCsvBtn")?.addEventListener("click",()=>copyText(testCsv(),"CSV"));
document.querySelector("#copyJsonBtn")?.addEventListener("click",()=>copyText(JSON.stringify(testPayload(),null,2),"JSON"));
if(testMode)loadTest();render();if(testMode)renderTestMetrics();
</script></body></html>

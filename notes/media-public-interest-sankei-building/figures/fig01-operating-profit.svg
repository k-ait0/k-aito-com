<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">図解1 フジ・メディアHD 2026年3月期 営業損益</title><desc id="svgdesc">メディア・コンテンツ事業マイナス308億円、都市開発・観光事業プラス252億円、連結全体マイナス88億円。</desc><rect width="1200" height="800" fill="#F8F7F1"/><rect x="58" y="48" width="108" height="46" rx="5" fill="#173C32" stroke="none"/><text x="112" y="79" font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">図解1</text><text x="189" y="81" font-size="38" fill="#173C32" font-weight="750" text-anchor="start" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">フジ・メディアHD 2026年3月期 営業損益</text><text x="60" y="137" font-size="20" fill="#52665D" font-weight="400" text-anchor="start" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">単位：億円　／　セグメント間取引・調整があるため単純合算不可</text><line x1="60" y1="163" x2="1140" y2="163" stroke="#D2DDD6" stroke-width="2" /><line x1="240" y1="199" x2="240" y2="565" stroke="#D2DDD6" stroke-width="1" stroke-dasharray="6 8"/><line x1="340" y1="199" x2="340" y2="565" stroke="#D2DDD6" stroke-width="1" stroke-dasharray="6 8"/><line x1="440" y1="199" x2="440" y2="565" stroke="#D2DDD6" stroke-width="1" stroke-dasharray="6 8"/><line x1="540" y1="199" x2="540" y2="565" stroke="#D2DDD6" stroke-width="1" stroke-dasharray="6 8"/><line x1="640" y1="199" x2="640" y2="565" stroke="#D2DDD6" stroke-width="1" stroke-dasharray="6 8"/><line x1="740" y1="199" x2="740" y2="565" stroke="#D2DDD6" stroke-width="1" stroke-dasharray="6 8"/><line x1="840" y1="199" x2="840" y2="565" stroke="#D2DDD6" stroke-width="1" stroke-dasharray="6 8"/><line x1="940" y1="199" x2="940" y2="565" stroke="#D2DDD6" stroke-width="1" stroke-dasharray="6 8"/><line x1="640" y1="193" x2="640" y2="565" stroke="#173C32" stroke-width="3" /><text x="640" y="193" font-size="21" fill="#173C32" font-weight="600" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">0</text><text x="306" y="192" font-size="19" fill="#B76E58" font-weight="600" text-anchor="start" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">赤字</text><text x="930" y="192" font-size="19" fill="#276B52" font-weight="600" text-anchor="start" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">黒字</text><text x="66" y="266" font-size="27" fill="#173C32" font-weight="600" text-anchor="start" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">メディア・コンテンツ</text><rect x="301" y="289" width="339" height="48" rx="6" fill="#B76E58" stroke="none"/><text x="318" y="322" font-size="28" fill="#FFFFFF" font-weight="750" text-anchor="start" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">−308</text><text x="66" y="388" font-size="27" fill="#173C32" font-weight="600" text-anchor="start" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">都市開発・観光</text><rect x="640" y="412" width="277" height="48" rx="6" fill="#276B52" stroke="none"/><text x="900" y="445" font-size="28" fill="#173C32" font-weight="750" text-anchor="end" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">+252</text><text x="66" y="511" font-size="27" fill="#173C32" font-weight="600" text-anchor="start" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">連結全体</text><rect x="543" y="534" width="97" height="48" rx="6" fill="#B76E58" stroke="none"/><text x="529" y="564" font-size="27" fill="#B76E58" font-weight="750" text-anchor="end" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">−88</text><rect x="62" y="623" width="1075" height="90" rx="14" fill="#EDE8DB" stroke="none"/><text x="95" y="658" font-size="21" fill="#173C32" font-weight="700" text-anchor="start" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">読み取り</text><text x="95" y="689" font-size="24" fill="#173C32" font-weight="500" text-anchor="start" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">メディアの赤字を、都市開発・観光事業の黒字が一部補った年度。</text><line x1="60" y1="737" x2="1140" y2="737" stroke="#D2DDD6" stroke-width="2" /><text x="60" y="770" font-size="17" fill="#52665D" font-weight="400" text-anchor="start" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">出典：フジ・メディアHD『2026年3月期 決算説明資料』</text></svg>
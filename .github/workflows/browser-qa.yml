name: Browser and metadata QA

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '**/index.html'
      - '*.css'
      - '*.js'
      - 'scripts/browser-smoke.cjs'
      - 'scripts/site-static-check.cjs'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout static site
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify sitemap and static references
        run: |
          node --check scripts/site-static-check.cjs
          node scripts/site-static-check.cjs
      - name: Install test runtime
        run: |
          npm install --prefix /tmp/kaito-qa --no-audit --no-fund --no-save playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/tmp/kaito-browsers /tmp/kaito-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser checks
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: |
          node --check scripts/browser-smoke.cjs
          node scripts/browser-smoke.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaito-desktop-mobile-screenshots
          path: qa-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

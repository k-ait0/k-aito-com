# Temporary QA-only branch. Manual trigger remains the only trigger.
# This file is NOT part of Draft PR #70 or main.
name: Browser and metadata QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce manual-only Actions policy
        run: node scripts/check-actions-manual-only.cjs
      - name: Run all 14 Kaito local-preflight checks
        run: node scripts/local-preflight.cjs
      - name: Run DWZ offline preflight
        run: node scripts/dwz-preflight.cjs
      - name: Check diagnostic result guard rejects skipped and missing evidence
        run: |
          node --check scripts/dwz-origin-result-guard.cjs
          node --check scripts/test-dwz-origin-result-guard.cjs
          node scripts/test-dwz-origin-result-guard.cjs
      - name: Install Playwright Chromium
        run: |
          npm install --prefix /tmp/kaito-qa --no-audit --no-fund --no-save playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/tmp/kaito-browsers /tmp/kaito-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: DWZ real localhost origin E2E
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: |
          node --check scripts/dwz-origin-e2e.cjs
          node scripts/dwz-origin-e2e.cjs
      - name: Preserve baseline Kaito six-viewport browser regression
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: |
          node --check scripts/browser-smoke.cjs
          node scripts/browser-smoke.cjs
      - name: Install Playwright WebKit (Safari engine approximation)
        run: |
          PLAYWRIGHT_BROWSERS_PATH=/tmp/kaito-browsers /tmp/kaito-qa/node_modules/.bin/playwright install --with-deps webkit
      - name: DWZ WebKit localhost-origin E2E (not physical iPad)
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
          DWZ_BROWSER_ENGINE: webkit
        run: node scripts/dwz-origin-e2e.cjs
      - name: Upload Kaito browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaito-dwz-manual-qa-screenshots
          path: qa-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

name: Validate complete hero transfer candidate

on:
  push:
    branches:
      - hero-transfer
    paths:
      - '.github/workflows/rebuild-hero-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          ref: hero-transfer
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Rebuild complete candidate and fully decode
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, subprocess

          ref='269056ed3fe31f009f88cc462ddf1f70a7977f99'
          chunks=[]
          for i in range(1,9):
              path=f'assets/transfer/hero/part-{i:02d}.txt'
              s=subprocess.check_output(['git','show',f'{ref}:{path}'], text=True)
              chunks.append(''.join(s.split()))
          payload=''.join(chunks)
          data=base64.b64decode(payload, validate=True)
          out=Path('assets/hero/hero-hq-new-opt.jpg')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(data)

          with Image.open(out) as im:
              if im.format!='JPEG' or im.size!=(1440,500):
                  raise RuntimeError(f'unexpected image: {im.format} {im.size}')
              im.load()
              print('FULL-DECODE OK', im.mode, im.size)

          print('BYTES', len(data))
          print('SHA256', hashlib.sha256(data).hexdigest())
          PY

      - name: Commit validated candidate only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero/hero-hq-new-opt.jpg
          if git diff --cached --quiet; then
            echo "No hero change needed"
            exit 0
          fi
          git commit -m "Restore validated high-resolution hero candidate"
          git push origin HEAD:hero-transfer

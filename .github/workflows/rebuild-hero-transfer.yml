name: Rebuild sharp hero asset

on:
  push:
    branches:
      - hero-transfer
    paths:
      - 'assets/transfer/hero-q10.b64'
      - '.github/workflows/rebuild-hero-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          ref: hero-transfer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Decode and verify hero
        run: |
          tr -d '\n\r ' < assets/transfer/hero-q10.b64 | base64 --decode > assets/hero/hero-bg.jpg
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          p = Path('assets/hero/hero-bg.jpg')
          data = p.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          wanted = '607e8f2e7bec8447c987eeb05f20b203201f9cd2f4672f88fdcdebe33fc70806'
          if digest != wanted:
              raise RuntimeError(f'hash mismatch: {digest}')
          with Image.open(p) as im:
              im.verify()
          with Image.open(p) as im:
              if im.format != 'JPEG' or im.size != (1440, 500):
                  raise RuntimeError(f'unexpected image: {im.format} {im.size}')
          print(f'OK {len(data)} bytes {digest}')
          PY

      - name: Commit hero only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero/hero-bg.jpg
          if git diff --cached --quiet; then
            echo "No hero change needed"
            exit 0
          fi
          git commit -m "Rebuild higher-quality hero background"
          git push origin HEAD:hero-transfer

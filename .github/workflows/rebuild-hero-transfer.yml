name: Rebuild verified hero asset

on:
  push:
    branches:
      - hero-transfer
    paths:
      - '.github/workflows/rebuild-hero-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          ref: hero-transfer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Rebuild and verify hero
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib

          parts=[]
          for i in range(1,9):
              p=Path(f'assets/transfer/hero/part-{i:02d}.txt')
              parts.append(''.join(p.read_text().split()))

          raw=base64.b64decode(''.join(parts), validate=True)
          digest=hashlib.sha256(raw).hexdigest()
          expected='54cb345ed0599137be25b304da4bcf886aee64d1aad7e492c6cfcb47381386a2'
          if digest != expected:
              raise RuntimeError(f'SHA mismatch: {digest}')

          out=Path('assets/hero/hero-hq-new-opt.jpg')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(raw)

          with Image.open(out) as im:
              im.load()
              if im.format != 'JPEG' or im.size != (1440,500):
                  raise RuntimeError(f'unexpected hero: {im.format} {im.size}')

          print('OK', len(raw), digest)
          PY

      - name: Commit verified hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero/hero-hq-new-opt.jpg
          if git diff --cached --quiet; then
            echo "No hero change needed"
            exit 0
          fi
          git commit -m "Restore verified high-resolution hero asset"
          git push origin HEAD:hero-transfer

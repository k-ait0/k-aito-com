name: Repair exact high-resolution hero asset

on:
  push:
    branches:
      - hero-transfer
    paths:
      - '.github/workflows/rebuild-hero-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          ref: hero-transfer
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Exhaustive two-character repair and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, multiprocessing as mp

          TARGET='54cb345ed0599137be25b304da4bcf886aee64d1aad7e492c6cfcb47381386a2'
          ALPHABET='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          def clean(path):
              return ''.join(Path(path).read_text().split())

          parts=[clean(f'assets/transfer/hero/part-{i:02d}.txt') for i in range(1,9)]
          p1=parts[0]
          p2=parts[1]
          prefix64=p1+p2[:4880]
          mid=p2[4880:5758]
          suffix64=p2[5758:]+''.join(parts[2:])

          assert len(prefix64)%4==0
          assert len(mid)==878
          assert len(suffix64)%4==0

          prefix=base64.b64decode(prefix64, validate=True)
          suffix=base64.b64decode(suffix64, validate=True)
          pairs=[a+b for a in ALPHABET for b in ALPHABET]

          def search_range(bounds):
              lo,hi=bounds
              base=hashlib.sha256(prefix)
              for pos in range(lo,hi):
                  left=mid[:pos]
                  right=mid[pos:]
                  for pair in pairs:
                      repaired=left+pair+right
                      middle=base64.b64decode(repaired, validate=True)
                      h=base.copy()
                      h.update(middle)
                      h.update(suffix)
                      if h.hexdigest()==TARGET:
                          return pos,pair,middle
              return None

          workers=min(4, mp.cpu_count())
          spans=[]
          total=len(mid)+1
          step=(total+workers-1)//workers
          for lo in range(0,total,step):
              spans.append((lo,min(total,lo+step)))

          print('SEARCH', total, 'positions x', len(pairs), 'pairs with', len(spans), 'workers')
          with mp.Pool(len(spans)) as pool:
              for result in pool.imap_unordered(search_range, spans):
                  if result is not None:
                      found=result
                      pool.terminate()
                      break
              else:
                  found=None

          if found is None:
              raise RuntimeError('No exact SHA match for any two-character insertion in the corrected transfer segment')

          pos,pair,middle=found
          data=prefix+middle+suffix
          digest=hashlib.sha256(data).hexdigest()
          if digest!=TARGET:
              raise RuntimeError(f'internal hash mismatch: {digest}')

          out=Path('assets/hero/hero-hq-new-opt.jpg')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(data)

          with Image.open(out) as im:
              if im.format!='JPEG' or im.size!=(1440,500):
                  raise RuntimeError(f'unexpected image: {im.format} {im.size}')
              im.load()

          print('FOUND position', pos, 'pair', repr(pair))
          print('OK', len(data), 'bytes', digest)
          PY

      - name: Commit verified hero only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero/hero-hq-new-opt.jpg
          if git diff --cached --quiet; then
            echo "No hero change needed"
            exit 0
          fi
          git commit -m "Restore verified high-resolution hero asset"
          git push origin HEAD:hero-transfer

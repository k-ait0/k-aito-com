name: Temporary KIDP002 article QA
on:
  push:
    branches: [feature/kidp002-article-a-20261007]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Static references
        run: node scripts/site-static-check.cjs
      - name: Install Playwright
        run: |
          npm install --prefix /tmp/kaito-qa --no-audit --no-fund --no-save playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/tmp/kaito-browsers /tmp/kaito-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser QA
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: node scripts/browser-smoke.cjs
      - name: Capture article and prototype
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kidp002-http.log 2>&1 &
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']});fs.mkdirSync('qa-screenshots',{recursive:true});
          for(const [name,w,h,path] of [
            ['desktop-kidp002-article',1440,900,'/notes/kidp-002-whynot/'],
            ['mobile-kidp002-article',390,844,'/notes/kidp-002-whynot/'],
            ['mobile-whynot-prototype',390,844,'/projects/kidp/whynot/prototype/']
          ]){const p=await b.newPage({viewport:{width:w,height:h}});await p.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});const x=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth-innerWidth,h1:[...document.querySelectorAll('h1')].filter(e=>e.getClientRects().length).length}));if(x.overflow>2||x.h1!==1)throw Error(name+' '+JSON.stringify(x));await p.screenshot({path:'qa-screenshots/'+name+'.png',fullPage:true});await p.close()}await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kidp002-article-visual-review
          path: qa-screenshots/*.png
          retention-days: 2

# trigger

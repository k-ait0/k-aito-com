name: Probe binary image blobs

on:
  push:
    branches:
      - asset-probe

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Inspect candidate assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          for p in sorted(Path('assets/probe').glob('*.webp')):
              data=p.read_bytes()
              print(f'FILE {p} bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()}')
              try:
                  with Image.open(p) as im:
                      im.load()
                      print(f'IMAGE {p} format={im.format} size={im.size} mode={im.mode}')
              except Exception as e:
                  print(f'ERROR {p}: {type(e).__name__}: {e}')
          PY

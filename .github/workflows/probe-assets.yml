name: Probe binary image blobs

on:
  push:
    branches:
      - asset-probe

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare visual review bundle
        run: |
          mkdir -p review
          cp assets/shelves/travel.webp review/01-travel-current.webp
          cp assets/shelves/drink.webp review/02-drink-current.webp
          cp assets/shelves/moneytax.webp review/03-moneytax-current.webp
          cp assets/shelves/study.webp review/04-study-current.webp
          cp assets/shelves/create.webp review/05-create-current.webp
          cp assets/shelves/project.webp review/06-project-current.webp
          cp assets/shelves/archive.webp review/07-archive-current.webp
          cp assets/probe/probe-2.webp review/02-drink-candidate.webp
          cp assets/probe/probe-1.webp review/04-study-candidate.webp
          sha256sum review/*
      - name: Upload visual review bundle
        uses: actions/upload-artifact@v4
        with:
          name: shelf-visual-review
          path: review/
          if-no-files-found: error

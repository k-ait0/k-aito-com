name: Probe binary image blobs

on:
  push:
    branches:
      - asset-probe

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Reconstruct candidate asset
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, io, struct

          p3 = Path('assets/probe/probe-3.webp').read_bytes()
          p4 = Path('assets/probe/probe-4.webp').read_bytes()
          txt = p4.decode('ascii').strip()
          txt += '=' * ((4 - len(txt) % 4) % 4)
          d4 = base64.b64decode(txt, validate=True)
          joined = d4 + p3
          if not joined.startswith(b'RIFF') or joined[8:12] != b'WEBP':
              raise RuntimeError('reconstructed stream is not WebP')
          total = struct.unpack('<I', joined[4:8])[0] + 8
          candidate = joined[:total]
          tail = joined[total:]
          Path('probe-output').mkdir(exist_ok=True)
          Path('probe-output/candidate.webp').write_bytes(candidate)
          Path('probe-output/trailing.bin').write_bytes(tail)
          with Image.open(io.BytesIO(candidate)) as im:
              im.load()
              print(f'CANDIDATE format={im.format} size={im.size} mode={im.mode} bytes={len(candidate)} sha256={hashlib.sha256(candidate).hexdigest()}')
          print(f'TRAILING bytes={len(tail)} sha256={hashlib.sha256(tail).hexdigest()} head={tail[:32].hex()} tail={tail[-32:].hex()}')
          PY
      - name: Upload reconstructed candidate
        uses: actions/upload-artifact@v4
        with:
          name: reconstructed-shelf-candidate
          path: probe-output/
          if-no-files-found: error

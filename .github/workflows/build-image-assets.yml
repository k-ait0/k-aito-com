name: Validate production assets

on:
  push:
    paths:
      - 'assets/shelves/*.webp'
      - 'assets/hero/**'
      - 'assets/brand/**'
      - 'homepage.css'
      - 'image-fix.css'
      - '.github/workflows/build-image-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate production files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          shelves = ('travel','drink','moneytax','study','create','project','archive')
          for name in shelves:
              path = Path('assets/shelves') / f'{name}.webp'
              if not path.is_file():
                  raise RuntimeError(f'missing production asset: {path}')
              with Image.open(path) as im:
                  im.verify()
              with Image.open(path) as im:
                  if im.format != 'WEBP' or im.size != (420, 236):
                      raise RuntimeError(f'{path}: expected WEBP 420x236, got {im.format} {im.size}')
              print(f'OK {path}')

          hero = Path('assets/hero/hero-bg.jpg')
          if not hero.is_file():
              raise RuntimeError(f'missing hero asset: {hero}')
          with Image.open(hero) as im:
              im.verify()
          with Image.open(hero) as im:
              if im.format != 'JPEG' or im.width < 1000 or im.height < 600:
                  raise RuntimeError(f'{hero}: unexpected image {im.format} {im.size}')
              print(f'OK {hero}: {im.size}')

          for path in (Path('assets/brand/kite-mark.svg'), Path('assets/brand/wordmark.svg'), Path('assets/brand/favicon.svg')):
              text = path.read_text(encoding='utf-8')
              if '<svg' not in text:
                  raise RuntimeError(f'{path}: invalid SVG')
              print(f'OK {path}')

          css = Path('image-fix.css').read_text(encoding='utf-8')
          required = (
              "@import url('/homepage.css?v=1')",
              "/assets/brand/kite-mark.svg?v=1",
              "/assets/brand/wordmark.svg?v=1",
              "/assets/hero/hero-bg.jpg?v=1",
          )
          for token in required:
              if token not in css:
                  raise RuntimeError(f'image-fix.css missing canonical reference: {token}')
          print('OK canonical CSS references')
          PY

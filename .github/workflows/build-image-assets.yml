name: Build image assets

on:
  push:
    paths:
      - 'assets/hero-tiles/**'
      - 'assets/shelf-b64/**'
      - 'assets/editorial-notebook.b64'
      - '.github/workflows/build-image-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Decode and validate image assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageFile
          import base64, io, re

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          root = Path('.')
          out = root / 'assets' / 'shelves'
          out.mkdir(parents=True, exist_ok=True)

          def source_chars(src: Path):
              raw = src.read_text(encoding='utf-8')
              return re.sub(r'[^A-Za-z0-9+/=]', '', raw).replace('=', '')

          def try_image(chars: str):
              if not chars: return None
              padded = chars + '=' * ((4 - len(chars) % 4) % 4)
              try:
                  data = base64.b64decode(padded, validate=False)
                  with Image.open(io.BytesIO(data)) as im: im.verify()
                  return data
              except Exception:
                  return None

          def repaired_image(src: Path):
              chars = source_chars(src)
              data = try_image(chars)
              if data is not None: return data
              for trim in range(1, 9):
                  data = try_image(chars[:-trim])
                  if data is not None: return data
              if len(chars) % 4 == 1:
                  for index in range(len(chars)):
                      data = try_image(chars[:index] + chars[index + 1:])
                      if data is not None: return data
              raise RuntimeError(f'FAILED {src}: source cannot be repaired as a JPEG')

          def decode_b64(src: Path, dst: Path):
              data = repaired_image(src)
              dst.write_bytes(data)
              with Image.open(dst) as im:
                  print(f'OK {dst}: {im.size[0]}x{im.size[1]} {im.format}')

          shelves = {
              'travel':'travel.b64','drink':'drink.b64','moneytax':'moneytax.b64',
              'study':'study.b64','create':'create.b64','project':'project.b64','archive':'archive.b64'
          }
          for name, src in shelves.items():
              decode_b64(root/'assets'/'shelf-b64'/src, out/f'{name}.jpg')
          decode_b64(root/'assets'/'editorial-notebook.b64', root/'assets'/'notebook-hq.jpg')

          with Image.open(root/'assets'/'hero-study.jpg') as fallback_src:
              fallback = fallback_src.convert('RGB')
          hero = ImageOps.fit(fallback,(1200,800),method=Image.Resampling.LANCZOS)
          recovered = 0
          for i in range(4):
              src = root/'assets'/'hero-tiles'/f'v2-col-{i}.b64'
              try:
                  data = repaired_image(src)
                  with Image.open(io.BytesIO(data)) as src_im: im = src_im.convert('RGB')
                  if im.size != (300,800): raise ValueError(f'unexpected size {im.size}')
                  hero.paste(im,(i*300,0)); recovered += 1
              except Exception as exc:
                  print(f'WARN {src}: {exc}; keeping fallback column {i}')
          hero.save(root/'assets'/'hero-hq.jpg','JPEG',quality=88,optimize=True,progressive=True)
          print(f'OK assets/hero-hq.jpg: recovered_columns={recovered}/4')
          PY

      - name: Refresh production asset versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = re.sub(r'/image-fix\.css\?v=\d+', '/image-fix.css?v=21', text)
              if path == Path('index.html'):
                  updated = re.sub(r'/app\.js\?v=\d+', '/app.js?v=5', updated)
                  updated = re.sub(r'/site-enhance\.js\?v=\d+', '/site-enhance.js?v=12', updated)
                  updated = re.sub(r'<img class="hero-background"[^>]*>', '', updated)
              else:
                  updated = re.sub(r'<script src="/site-enhance\.js\?v=\d+" defer></script>', '', updated)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  print(f'Updated {path}')
          PY

      - name: Commit production assets
        run: |
          if [ -z "$(git status --porcelain -- assets/hero-hq.jpg assets/notebook-hq.jpg assets/shelves '*.html')" ]; then
            echo 'No production asset changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hero-hq.jpg assets/notebook-hq.jpg assets/shelves '*.html'
          git commit -m 'Activate final hero alignment'
          git push

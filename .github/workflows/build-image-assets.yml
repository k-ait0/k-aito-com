name: Validate production assets

on:
  push:
    paths:
      - 'assets/shelves/*.webp'
      - 'assets/hero/**'
      - 'assets/brand/**'
      - 'homepage.css'
      - 'image-fix.css'
      - 'index.html'
      - '.github/workflows/build-image-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate production files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          shelves = ('travel','drink','moneytax','study','create','project','archive')
          for name in shelves:
              path = Path('assets/shelves') / f'{name}.webp'
              if not path.is_file():
                  raise RuntimeError(f'missing production asset: {path}')
              with Image.open(path) as im:
                  im.verify()
              with Image.open(path) as im:
                  if im.format != 'WEBP' or im.size != (420, 236):
                      raise RuntimeError(f'{path}: expected WEBP 420x236, got {im.format} {im.size}')
              print(f'OK {path}')

          hero = Path('assets/hero/hero-bg.jpg')
          if not hero.is_file():
              raise RuntimeError(f'missing hero asset: {hero}')
          with Image.open(hero) as im:
              im.verify()
          with Image.open(hero) as im:
              if im.format != 'JPEG' or im.width < 1200 or im.height < 480:
                  raise RuntimeError(f'{hero}: unexpected image {im.format} {im.size}')
              print(f'OK {hero}: {im.size}')

          mark = Path('assets/brand/kite-mark.png')
          if not mark.is_file():
              raise RuntimeError(f'missing brand mark: {mark}')
          with Image.open(mark) as im:
              im.verify()
          with Image.open(mark) as im:
              if im.format != 'PNG' or im.width < 128 or im.height < 128:
                  raise RuntimeError(f'{mark}: unexpected image {im.format} {im.size}')
              print(f'OK {mark}: {im.size}')

          for path in (Path('assets/brand/wordmark.svg'), Path('assets/brand/favicon.svg')):
              text = path.read_text(encoding='utf-8')
              if '<svg' not in text:
                  raise RuntimeError(f'{path}: invalid SVG')
              print(f'OK {path}')

          css = Path('image-fix.css').read_text(encoding='utf-8')
          required_patterns = (
              r"@import url\('/homepage\.css\?v=\d+'\)",
              r"/assets/brand/kite-mark\.png\?v=\d+",
              r"/assets/brand/wordmark\.svg\?v=\d+",
              r"/assets/hero/hero-bg\.jpg\?v=\d+",
          )
          for pattern in required_patterns:
              if not re.search(pattern, css):
                  raise RuntimeError(f'image-fix.css missing canonical reference matching: {pattern}')

          homepage = Path('homepage.css').read_text(encoding='utf-8')
          for path in ('home-layout.css','enhance.css','homepage-polish.css'):
              if not re.search(rf"@import url\('/{re.escape(path)}\?v=\d+'\)", homepage):
                  raise RuntimeError(f'homepage.css missing versioned import: {path}')

          html = Path('index.html').read_text(encoding='utf-8')
          if not re.search(r'href="/image-fix\.css\?v=\d+"', html):
              raise RuntimeError('index.html missing versioned image-fix.css reference')

          print('OK canonical CSS and HTML references')
          PY

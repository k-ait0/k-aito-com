name: Temporary KIDP003 test review QA
on:
  push:
    branches: [feature/kidp003-p0-test-review-20261007]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static references
        run: node scripts/site-static-check.cjs
      - name: Install Playwright
        run: |
          npm install --prefix /tmp/kaito-qa --no-audit --no-fund --no-save playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/tmp/kaito-browsers /tmp/kaito-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Existing browser QA
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: node scripts/browser-smoke.cjs
      - name: Test review logic
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kidp003-review-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            for(const [name,w,h] of [['desktop',1440,900],['mobile',390,844]]){
              const p=await b.newPage({viewport:{width:w,height:h}});
              await p.goto('http://127.0.0.1:4173/projects/kidp/life-design-lab/test-review/',{waitUntil:'networkidle'});
              if(await p.locator('h1:visible').count()!==1) throw Error(name+' visible h1');
              if(await p.locator('.url-row').count()!==10) throw Error(name+' participant links');
              await p.click('#loadSampleBtn');
              await p.click('#analyzeBtn');
              if(await p.locator('#decision strong').innerText()!=='P1 GO') throw Error(name+' sample decision '+await p.locator('#decision strong').innerText());
              if(await p.locator('#mN').innerText()!=='5') throw Error(name+' sample n');
              if(await p.locator('#m1').innerText()!=='100%') throw Error(name+' completion');
              if(await p.locator('#m4').innerText()!=='0%') throw Error(name+' diagnosis');
              const overflow=await p.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              if(overflow>2) throw Error(name+' horizontal overflow '+overflow);

              const one=await p.evaluate(()=>{
                const rows=parseCSV(document.querySelector('#csvInput').value);
                return [rows[0],rows[1]].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');
              });
              await p.fill('#csvInput',one);
              await p.click('#analyzeBtn');
              if(await p.locator('#decision strong').innerText()!=='MORE DATA') throw Error(name+' less-than-5 decision');

              const sample=await p.evaluate(()=>sampleHeader+'\n'+sampleRows);
              const parsed=await p.evaluate(s=>parseCSV(s),sample);
              if(parsed[0].length!==26) throw Error(name+' header columns '+parsed[0].length);
              if(parsed[1].length!==26) throw Error(name+' row columns '+parsed[1].length);
              await p.close();
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

name: A05 D271 Ver2.2 Chromium WebKit and WCAG research UX audit
on:
  push:
    branches:
      - research/a05-d271-ux-acceptance-20261120
    paths:
      - '.github/workflows/a05-d271-ux-audit.yml'
      - 'scripts/test-a05-d271-ux-audit.cjs'
      - 'docs/A05_D271_UX_AUDIT_HANDOFF_20261120.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-ux-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original published previews and D262 source remain unchanged
        run: |
          git fetch origin gh-pages
          test "$(git show origin/gh-pages:index.html | sha256sum | cut -d' ' -f1)" = 'd4be3ac612c7bc1cad07bbbb385a7b6910614ac0356598ae6345d7ed5300d070'
          test "$(git show origin/gh-pages:preview/yn/index.html | sha256sum | cut -d' ' -f1)" = '5cf61a5114e69c292080be803ae835c5e75d400f4a773a8e89fb2347547d11e1'
          test "$(git show origin/gh-pages:preview/yn-v2/index.html | sha256sum | cut -d' ' -f1)" = '31d6ecf62393c24100604c51a1ba0ec280369f8780e37c2bc775b1913ba6dfc8'
          test "$(git show origin/gh-pages:preview/yn-v21/index.html | sha256sum | cut -d' ' -f1)" = '39a07c893b1060b06f0a6050d2610510f494eb85801034c2b85ecee811164c0f'
          test "$(git show origin/gh-pages:preview/yn-v22/index.html | sha256sum | cut -d' ' -f1)" = 'fa0919ce234aa01674f52a1ee999bea4fe0d92695ae9cc9e1924fd18ca9bdc61'
          test "$(git show origin/gh-pages:preview/a05-analytics-d265/index.html | sha256sum | cut -d' ' -f1)" = '01669940e630341742521f561dde0ff5badceea2491595f01c15046109632650'
          git diff --exit-code origin/research/a05-d270-real-classifier-db-20261120 HEAD -- research/a05/d262-result-parameters-v22-template.html scripts/a05-d255-yn-provisional-classifier.mjs
      - name: Build exact original Ver2.2 and check test syntax
        run: |
          node scripts/a05-d262-build-result-v22.mjs
          node --check scripts/test-a05-d271-ux-audit.cjs
          test -s research/a05/generated/d262-result-v22-preview.html
      - name: Install disposable browser, WebKit and axe audit tooling
        run: |
          npm install --prefix /tmp/a05-d271-qa --no-audit --no-fund --no-save playwright@1.56.1 axe-core@4.10.3
          NODE_PATH=/tmp/a05-d271-qa/node_modules /tmp/a05-d271-qa/node_modules/.bin/playwright install --with-deps webkit
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --version
          echo "A05_CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Run Chromium and WebKit research UX audit (find defects, do not claim acceptance)
        env:
          NODE_PATH: /tmp/a05-d271-qa/node_modules
        run: node scripts/test-a05-d271-ux-audit.cjs
      - name: Declare QA scope accurately
        run: |
          test ! -e preview/a05-d271
          echo 'A05_D271_QA_AUDIT_DONE_NOT_HUMAN_ACCEPTANCE'

name: Analytics historical data research regression (no network or publication)
on:
  push:
    branches:
      - analytics-historical-v0-1-20261110
    paths:
      - .github/workflows/analytics-historical-research-regression.yml
      - scripts/test-analytics-commodity-rights.cjs
      - scripts/analytics-rights-gate.cjs
      - scripts/analytics-personal-cash-fx-cpi.py
      - scripts/test-analytics-personal-cash-fx-cpi.py
      - scripts/test-analytics-personal-ui.cjs
      - scripts/test-analytics-dwz-withdrawal-phase.cjs
      - scripts/test-analytics-two-asset.cjs
      - scripts/test-analytics-personal-monthly-contribution.cjs
      - scripts/test-analytics-personal-dom.cjs
      - scripts/analytics-annual-personal-jpy.cjs
      - scripts/import-analytics-jquants-topix-tr-personal.cjs
      - scripts/research-acquire-damodaran-annual.cjs
      - research/analytics/fixtures/dwz_simulateOne_r4_v16_9_research_fixture.js
      - research/analytics/personal-lab/index.html
      - research/analytics/personal_use_scope.v0.1.json
      - research/analytics/source_registry.v0.2.json
      - research/analytics/acquisition_status.v0.1.json
      - research/analytics/worldbank_71_series_triage.v0.1.json
      - research/analytics/commercial_data_rights_triage.v0.1.json
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze and QA without downloading any licensed series
        run: |
          set -euo pipefail
          node scripts/check-analytics-source-registry.cjs
          node scripts/acquire-analytics-approved-source.cjs --selftest
          node scripts/test-analytics-bls-missing-gap.cjs
          node scripts/test-analytics-history-coverage.cjs
          node scripts/test-analytics-commodity-rights.cjs
          python3 scripts/test-analytics-personal-cash-fx-cpi.py
          node scripts/test-analytics-personal-ui.cjs
          node scripts/test-analytics-dwz-withdrawal-phase.cjs
          node scripts/test-analytics-two-asset.cjs
          node scripts/test-analytics-personal-monthly-contribution.cjs
          node scripts/research-acquire-damodaran-annual.cjs --selftest
          node scripts/analytics-annual-personal-jpy.cjs --selftest
          node scripts/import-analytics-jquants-topix-tr-personal.cjs --selftest
          node scripts/test-analytics-personal-dom.cjs
          node scripts/test-align-analytics-historical-series.cjs
          python3 -m py_compile scripts/research-probe-fed-h10-ddp.py scripts/normalize-analytics-fed-ddp-candidate.py scripts/normalize-analytics-estat-cpi.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/analytics/source_registry.v0.2.json').read_text())
          a=json.loads(Path('research/analytics/acquisition_status.v0.1.json').read_text())
          assert len(r['assets'])==12 and len(r['auxiliary'])==8
          assert r['policy']['no_auto_fallback'] and not r['policy']['public_display_default']
          assert not any(x.get('site_use_approved') for x in r['assets']+r['auxiliary'])
          assert a['summary']['site_approved_series']==0
          assert a['datasets'][-1]['dataset_id']=='FED_H10_1971_DDP_CANDIDATE_RESEARCH'
          assert a['datasets'][-1]['source_change_adr_status']=='DRAFT_NOT_APPROVED'
          assert r['auxiliary'][0]['provider_id']=='FED_BOARD'
          assert r['auxiliary'][0]['full_pinned_history_20261111']['full_1971_1999_not_acquired']
          print('PASS: Research ledger and 12+8 frozen source/rights gates; Fed DDP candidate remains ADR draft')
          PY
      - name: Package standalone personal HTML (synthetic constants only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kaito-analytics-personal-lab-v0-4
          path: research/analytics/personal-lab/index.html
          retention-days: 7
          if-no-files-found: error

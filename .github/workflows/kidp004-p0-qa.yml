name: Temporary KIDP004 P0 QA
on:
  push:
    branches: [feature/kidp004-station-life-p0-20261007]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static references
        run: node scripts/site-static-check.cjs
      - name: Install Playwright
        run: |
          npm install --prefix /tmp/kaito-qa --no-audit --no-fund --no-save playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/tmp/kaito-browsers /tmp/kaito-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Existing browser QA
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: node scripts/browser-smoke.cjs
      - name: KIDP004 interaction QA
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kidp004-http.log 2>&1 &
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            fs.mkdirSync('qa-screenshots',{recursive:true});
            for(const [name,w,h] of [['desktop',1440,900],['mobile',390,844]]){
              const p=await b.newPage({viewport:{width:w,height:h}});
              await p.goto('http://127.0.0.1:4173/projects/kidp/station-life/prototype/',{waitUntil:'networkidle'});
              if(await p.locator('h1:visible').count()!==1) throw Error(name+' landing h1');
              await p.screenshot({path:'qa-screenshots/'+name+'-kidp004-landing.png',fullPage:true});
              await p.click('#startBtn');

              async function bestName(){
                return (await p.locator('.area.best h3').innerText()).trim();
              }
              const commuter=await bestName();
              if(commuter!=='COMMUTE LINE') throw Error(name+' commuter best '+commuter);

              await p.click('[data-life="hybrid"]');
              const hybrid=await bestName();
              if(hybrid!=='LOCAL LOOP') throw Error(name+' hybrid best '+hybrid);

              await p.click('[data-life="night"]');
              const night=await bestName();
              if(night!=='COMMUTE LINE') throw Error(name+' night best '+night);

              await p.locator('.area').filter({hasText:'QUIET EDGE'}).locator('button').click();
              if(!await p.locator('#detail.screen.on').count()) throw Error(name+' detail not open');
              if((await p.locator('#detailName').innerText()).trim()!=='QUIET EDGE') throw Error(name+' wrong detail');
              if((await p.locator('#timeline .step').count())!==4) throw Error(name+' timeline steps');
              if((await p.locator('#detailFriction').innerText()).trim()!=='72') throw Error(name+' night C friction');
              const overflow=await p.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              if(overflow>2) throw Error(name+' horizontal overflow '+overflow);
              await p.screenshot({path:'qa-screenshots/'+name+'-kidp004-detail.png',fullPage:true});
              await p.close();
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kidp004-p0-visual-review
          path: qa-screenshots/*.png
          retention-days: 2

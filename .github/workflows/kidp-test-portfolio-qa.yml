name: Temporary KIDP test portfolio QA
on:
  push:
    branches: [feature/kidp-test-portfolio-20261008]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static references
        run: node scripts/site-static-check.cjs
      - name: Install Playwright
        run: |
          npm install --prefix /tmp/kaito-qa --no-audit --no-fund --no-save playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/tmp/kaito-browsers /tmp/kaito-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Existing browser QA
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: node scripts/browser-smoke.cjs
      - name: KIDP portfolio QA
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kidp-portfolio-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            for(const [name,w,h] of [['desktop',1440,900],['mobile',390,844]]){
              const p=await b.newPage({viewport:{width:w,height:h}});
              await p.goto('http://127.0.0.1:4173/projects/kidp/',{waitUntil:'networkidle'});
              if(await p.locator('.kidp-test-row').count()!==6) throw Error(name+' test rows');
              const labels=await p.locator('.kidp-test-row small').allInnerTexts();
              for(const expected of ['RUN NOW','PREP NEXT','RECRUIT MIX','SCHEDULE PHYSICAL']){
                if(!labels.some(x=>x.includes(expected))) throw Error(name+' missing '+expected);
              }
              const hrefs=await p.locator('.kidp-test-row').evaluateAll(xs=>xs.map(x=>x.getAttribute('href')));
              const expected=[
                '/projects/kidp/station-life/test-review/',
                '/projects/kidp/life-design-lab/test-review/',
                '/projects/kidp/whynot/',
                '/projects/kidp/building-transformer/test-review/',
                '/projects/kidp/board-game-balancer/test-review/',
                '/projects/kidp/project-give/'
              ];
              if(JSON.stringify(hrefs)!==JSON.stringify(expected)) throw Error(name+' href order '+JSON.stringify(hrefs));
              const overflow=await p.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              if(overflow>2) throw Error(name+' overflow '+overflow);
              await p.close();
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

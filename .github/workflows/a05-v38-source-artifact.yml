name: A05 v38 isolated source export for art QA
on:
  pull_request:
    paths:
      - ".github/workflows/a05-v38-source-artifact.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: a05-v38-source-for-local-art-qa
          path: |
            projects/kidp/life-design-lab/a05/**
            assets/brand/favicon.svg
          retention-days: 1

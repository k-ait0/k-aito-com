name: A05 D239 blank cognitive interview fieldwork kit

on:
  push:
    branches:
      - research/a05-editorial-50-v1-20261113
    paths:
      - 'scripts/a05-d237-build-cognitive-interview-kit.mjs'
      - 'scripts/test-a05-d237-cognitive-kit.mjs'
      - 'scripts/a05-d238-blind-coding-aggregator.mjs'
      - 'scripts/test-a05-d238-blind-coding.mjs'
      - 'scripts/a05-d239-build-fieldwork-bundle.mjs'
      - 'scripts/test-a05-d239-fieldwork-bundle.mjs'
      - '.github/workflows/a05-d239-fieldwork-pack.yml'
      - 'research/a05/d232-content-triage-and-c36-candidates.json'
      - 'research/a05/d206-editorial-50-question-bank-v1-2.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blank-fieldwork:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scripts and interview/rater/fieldwork tests
        run: |
          node --check scripts/a05-d237-build-cognitive-interview-kit.mjs
          node --check scripts/a05-d238-blind-coding-aggregator.mjs
          node --check scripts/a05-d239-build-fieldwork-bundle.mjs
          node --test scripts/test-a05-d237-cognitive-kit.mjs scripts/test-a05-d238-blind-coding.mjs scripts/test-a05-d239-fieldwork-bundle.mjs
      - name: Build 24 blank interviewer sheets and 48 blank rater sheets
        run: node scripts/a05-d239-build-fieldwork-bundle.mjs
      - name: Verify empty inputs remain NO_REAL_COGNITIVE_DATA
        run: node scripts/a05-d238-blind-coding-aggregator.mjs
      - name: Upload BLANK ONLY fieldwork kit
        uses: actions/upload-artifact@v4
        with:
          name: a05-d239-blank-interview-kit
          path: |
            research/a05/generated/d237-blank-interview-plan.json
            research/a05/generated/d237-blank-interview-kit.md
            research/a05/generated/d239-blank-rater-codes.json
            research/a05/generated/d239-fieldwork-quickstart.md
          if-no-files-found: error
          retention-days: 30

name: Rebuild nuclear article manga

on:
  push:
    branches:
      - article/nuclear-industrial-carrier
    paths:
      - 'assets/transfer/nuclear-industrial-carrier/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout article branch
        uses: actions/checkout@v4
        with:
          ref: article/nuclear-industrial-carrier

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild manga images
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          src = Path('assets/transfer/nuclear-industrial-carrier')
          out = Path('assets/notes/nuclear-industrial-carrier')
          out.mkdir(parents=True, exist_ok=True)

          specs = [
              (1, 'manga-01-part-*.b64', 'manga-01.webp', b'RIFF', b'WEBP'),
              (2, 'manga-02-avif-part-*.b64', 'manga-02.avif', None, b'ftypavif'),
              (3, 'manga-03-avif-part-*.b64', 'manga-03.avif', None, b'ftypavif'),
              (4, 'manga-04-avif-part-*.b64', 'manga-04.avif', None, b'ftypavif'),
          ]

          for page, pattern, filename, prefix, marker in specs:
              chunks = sorted(src.glob(pattern))
              if not chunks:
                  raise RuntimeError(f'no chunks for page {page}')
              payload = ''.join(''.join(p.read_text().split()) for p in chunks)
              raw = base64.b64decode(payload, validate=True)
              if prefix is not None and not raw.startswith(prefix):
                  raise RuntimeError(f'{filename}: invalid prefix')
              if marker not in raw[:32]:
                  raise RuntimeError(f'{filename}: invalid format marker')
              target = out / filename
              target.write_bytes(raw)
              print(target, len(raw), hashlib.sha256(raw).hexdigest())
          PY

      - name: Commit manga images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/notes/nuclear-industrial-carrier/manga-01.webp
          git add assets/notes/nuclear-industrial-carrier/manga-02.avif
          git add assets/notes/nuclear-industrial-carrier/manga-03.avif
          git add assets/notes/nuclear-industrial-carrier/manga-04.avif
          if git diff --cached --quiet; then
            echo "No image change needed"
            exit 0
          fi
          git commit -m "Build nuclear article manga assets"
          git push origin HEAD:article/nuclear-industrial-carrier

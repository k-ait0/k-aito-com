name: Temporary KIDP Wave A recruitment QA
on:
  push:
    branches: [feature/kidp-wave-a-recruitment-kit-20261008]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static references
        run: node scripts/site-static-check.cjs
      - name: Install Playwright
        run: |
          npm install --prefix /tmp/kaito-qa --no-audit --no-fund --no-save playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/tmp/kaito-browsers /tmp/kaito-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Existing browser QA
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: node scripts/browser-smoke.cjs
      - name: Recruitment kit QA
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kidp-wave-a-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            for(const [name,w,h] of [['desktop',1440,900],['mobile',390,844]]){
              const p=await b.newPage({viewport:{width:w,height:h}});
              await p.goto('http://127.0.0.1:4173/projects/kidp/test-ops/',{waitUntil:'networkidle'});
              if(await p.locator('.recruit-card').count()!==2) throw Error(name+' recruit cards');
              if(await p.locator('.session-box').count()!==2) throw Error(name+' session boxes');
              if(await p.locator('[data-copy]').count()<3) throw Error(name+' copy buttons');
              const station=await p.locator('#inviteStation').innerText();
              const life=await p.locator('#inviteLife').innerText();
              if(!station.includes('駅徒歩8分')||!station.includes('15分')) throw Error(name+' station invite');
              if(!life.includes('20回')||!life.includes('適性診断')) throw Error(name+' life invite');
              const opening=await p.locator('#openingScript').innerText();
              if(!opening.includes('試作品の方をテスト')) throw Error(name+' opening');
              const text=await p.locator('body').innerText();
              for(const expected of ['通勤型 2人','Hybrid / 在宅型 2人','目標が比較的明確 2人','VALID NEGATIVE SIGNAL']){
                if(!text.includes(expected)) throw Error(name+' missing '+expected);
              }
              const overflow=await p.evaluate(()=>document.documentElement.scrollWidth-innerWidth);
              if(overflow>2) throw Error(name+' overflow '+overflow);
              await p.close();
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

name: Temporary KIDP003 P0 QA
on:
  push:
    branches: [feature/kidp003-life-design-lab-p0-20261007]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static references
        run: node scripts/site-static-check.cjs
      - name: Install Playwright
        run: |
          npm install --prefix /tmp/kaito-qa --no-audit --no-fund --no-save playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/tmp/kaito-browsers /tmp/kaito-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Existing browser QA
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: node scripts/browser-smoke.cjs
      - name: KIDP003 P0 interaction QA
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kidp003-http.log 2>&1 &
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            fs.mkdirSync('qa-screenshots',{recursive:true});
            for(const [name,w,h] of [['desktop',1440,900],['mobile',390,844]]){
              const p=await b.newPage({viewport:{width:w,height:h}});
              await p.goto('http://127.0.0.1:4173/projects/kidp/life-design-lab/prototype/',{waitUntil:'networkidle'});
              if(await p.locator('h1:visible').count()!==1) throw Error(name+' landing visible h1');
              await p.screenshot({path:'qa-screenshots/'+name+'-kidp003-landing.png',fullPage:true});
              await p.click('#startBtn');
              if(!(await p.locator('#counter').innerText()).includes('01 / 20')) throw Error(name+' start counter');
              await p.click('[data-choice="WANT"]');
              await p.click('#undoBtn');
              if(!(await p.locator('#counter').innerText()).includes('01 / 20')) throw Error(name+' undo');
              for(let i=0;i<20;i++){
                const choice=i%3===0?'WANT':i%3===1?'MAYBE':'PASS';
                await p.click('[data-choice="'+choice+'"]');
              }
              if(!await p.locator('#result.screen.on').count()) throw Error(name+' result screen');
              const ranks=await p.locator('.rank').count();
              if(ranks!==5) throw Error(name+' expected 5 ranks, got '+ranks);
              const saved=await p.evaluate(()=>JSON.parse(localStorage.getItem('kidp003.p0.responses')||'[]').length);
              if(saved!==20) throw Error(name+' localStorage '+saved);
              const overflow=await p.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              if(overflow>2) throw Error(name+' horizontal overflow '+overflow);
              await p.screenshot({path:'qa-screenshots/'+name+'-kidp003-result.png',fullPage:true});
              await p.reload({waitUntil:'networkidle'});
              await p.click('#startBtn');
              if(!await p.locator('#result.screen.on').count()) throw Error(name+' saved result reopen');
              await p.close();
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kidp003-p0-visual-review
          path: qa-screenshots/*.png
          retention-days: 2

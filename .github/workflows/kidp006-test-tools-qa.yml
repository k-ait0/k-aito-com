name: Temporary KIDP006 test tools QA
on:
  push:
    branches: [feature/kidp006-p0-test-tools-20261008]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static references
        run: node scripts/site-static-check.cjs
      - name: Install Playwright
        run: |
          npm install --prefix /tmp/kaito-qa --no-audit --no-fund --no-save playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/tmp/kaito-browsers /tmp/kaito-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Existing browser QA
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: node scripts/browser-smoke.cjs
      - name: KIDP006 test tools
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kidp006-test-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});

            const normal=await b.newPage({viewport:{width:390,height:844}});
            await normal.goto('http://127.0.0.1:4173/projects/kidp/building-transformer/prototype/',{waitUntil:'networkidle'});
            await normal.click('#startBtn');
            if(await normal.locator('.test-panel').isVisible()) throw Error('normal mode exposes test UI');
            await normal.close();

            const p=await b.newPage({viewport:{width:390,height:844}});
            await p.goto('http://127.0.0.1:4173/projects/kidp/building-transformer/prototype/?test=1&pid=P01',{waitUntil:'networkidle'});
            await p.click('#startBtn');
            if(!await p.locator('.test-panel').isVisible()) throw Error('test UI hidden');
            if(await p.locator('#participantId').inputValue()!=='P01') throw Error('pid');

            await p.click('[data-preset="street"]');
            await p.locator('#ceiling').evaluate(el=>{el.value='3.4';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await p.locator('.use-card').filter({hasText:'Fitness Studio'}).locator('.detail-btn').click();
            await p.click('#backBtn');

            await p.selectOption('#m1Input','yes');
            await p.selectOption('#m2Input','yes');
            await p.selectOption('#m3Input','yes');
            await p.selectOption('#m4Input','no');
            await p.selectOption('#m5Input','yes');
            await p.fill('#unknownNamed','床荷重');
            await p.selectOption('#preferredUse','fitness');
            await p.fill('#firstQuote','条件から見るのが分かりやすい');

            const payload=await p.evaluate(()=>testPayload());
            if(payload.inputs_changed.length!==1||payload.inputs_changed[0]!=='ceiling') throw Error('inputs '+JSON.stringify(payload.inputs_changed));
            if(payload.presets_tried.length!==1||payload.presets_tried[0]!=='street') throw Error('presets '+JSON.stringify(payload.presets_tried));
            if(payload.details_viewed.length!==1||payload.details_viewed[0]!=='fitness') throw Error('details '+JSON.stringify(payload.details_viewed));
            if(payload.positioning_understood!=='yes'||payload.verdict_misread!=='no'||payload.can_name_unknown!=='yes') throw Error('manual fields');
            if(payload.unknown_named!=='床荷重') throw Error('unknown named');
            const cols=await p.evaluate(()=>{const s=testCsv();let q=false,count=1;for(let i=0;i<s.length;i++){if(s[i]==='"'){if(q&&s[i+1]==='"')i++;else q=!q}else if(s[i]===','&&!q)count++}return count});
            if(cols!==19) throw Error('CSV columns '+cols);

            await p.reload({waitUntil:'networkidle'});
            await p.click('#startBtn');
            if((await p.locator('#mInputs').innerText()).trim()!=='1') throw Error('stored inputs');
            if((await p.locator('#mPresets').innerText()).trim()!=='1') throw Error('stored presets');
            if((await p.locator('#mDetails').innerText()).trim()!=='1') throw Error('stored details');
            await p.close();

            for(const [name,w,h] of [['desktop',1440,900],['mobile',390,844]]){
              const r=await b.newPage({viewport:{width:w,height:h}});
              await r.goto('http://127.0.0.1:4173/projects/kidp/building-transformer/test-review/',{waitUntil:'networkidle'});
              if(await r.locator('.url-row').count()!==10) throw Error(name+' links');
              await r.click('#sample'); await r.click('#analyze');
              if(await r.locator('#decision strong').innerText()!=='P1 GO') throw Error(name+' sample decision '+await r.locator('#decision strong').innerText());
              if(await r.locator('#m1').innerText()!=='100%'||await r.locator('#m4').innerText()!=='0%'||await r.locator('#m5').innerText()!=='100%') throw Error(name+' metrics');
              const one=await r.evaluate(()=>{const rows=parseCSV(document.querySelector('#csvInput').value);return [rows[0],rows[1]].map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n')});
              await r.fill('#csvInput',one); await r.click('#analyze');
              if(await r.locator('#decision strong').innerText()!=='MORE DATA') throw Error(name+' <5 decision');
              const overflow=await r.evaluate(()=>document.documentElement.scrollWidth-innerWidth);
              if(overflow>2) throw Error(name+' overflow '+overflow);
              await r.close();
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

name: KIDP Wave A Browser QA
on:
  # Manual-only. See docs/GITHUB_ACTIONS_POLICY.md.
  workflow_dispatch:
  # TEMPORARY A05 QA EXCEPTION — only one marker file on the isolated beta branch.
  # Restore manual-only immediately after inspecting the resulting run.
  push:
    branches:
      - release/a05-beta-report-20261107
    paths:
      - docs/A05_QA_TRIGGER_ONCE_20261107.txt

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Start static server and run Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/kidp-server.log 2>&1 &
          sleep 2
          node projects/kidp/qa_wave_a_browser.cjs
      - name: A05 beta scoring, storage and report contracts (Node 22)
        run: |
          node --test scripts/test-a05-engine.mjs scripts/test-a05-storage.mjs scripts/test-a05-report.mjs scripts/test-a05-release-contract.mjs scripts/test-a05-ui-report-contract.mjs
      - name: A05 beta browser acceptance (30Q to 10-page PDF)
        run: |
          node scripts/qa_a05_browser.cjs

name: KIDP Wave A Browser QA
on:
  pull_request:
    paths:
      - "projects/kidp/**"
      - "scripts/qa_a05_browser.cjs"
      - "scripts/test-a05-*.mjs"
      - "scripts/a05-research-*.mjs"
      - "docs/A05_D*.md"
      - "docs/A05_D*.json"
      - ".github/workflows/kidp-wave-a-browser-qa.yml"
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check A05 scope (avoid unrelated QA cost)
        id: a05scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          # Pull-request merge HEAD^1 is the base branch, so diffing
          # HEAD^1..HEAD always includes *all* historical A05 edits.
          # For a synchronize event use the actual before/after PR head
          # range. This handles multi-commit pushes, unlike HEAD^2^..HEAD^2.
          # If that delta cannot be verified, fail open: run full QA.
          changed=true
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" &&
                "$PR_ACTION" == "synchronize" &&
                "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ &&
                "$AFTER_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             git rev-parse -q --verify HEAD^2 >/dev/null 2>&1 &&
             [[ "$(git rev-parse HEAD^2)" == "$AFTER_SHA" ]] &&
             git fetch --no-tags --depth=1 origin "$BEFORE_SHA" >/dev/null 2>&1 &&
             git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" |
               grep -Eq '^(projects/kidp/life-design-lab/a05/|scripts/(qa_a05_browser\.cjs|test-a05-.*\.mjs|a05-research-.*\.mjs)|\.github/workflows/kidp-wave-a-browser-qa\.yml)'; then
              changed=true
            else
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: A05 PR #61 full-diff review inventory (including docs-only changes)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 61 }}
        run: node --test scripts/test-a05-pr-review-manifest.mjs
      - name: A05 native Node domain and storage tests
        if: ${{ steps.a05scope.outputs.changed == 'true' }}
        run: |
          node --test scripts/test-a05-engine.mjs
          node --test scripts/test-a05-format.mjs
          node --test scripts/test-a05-backup-inspect.mjs
          node --test scripts/test-a05-restore-review.mjs
          node --test scripts/test-a05-release-boundaries.mjs
          node --test scripts/test-a05-storage.mjs
          node --test scripts/test-a05-research-manifest.mjs scripts/test-a05-research-d36.mjs
          node --test scripts/test-a05-research-g1.mjs
          node --test scripts/test-a05-research-d40.mjs
          node --test scripts/test-a05-research-d41.mjs
          node --test scripts/test-a05-research-d42.mjs
      - name: A05 site-wide local preflight and diff checks
        if: ${{ steps.a05scope.outputs.changed == 'true' }}
        run: |
          node scripts/local-preflight.cjs
          git diff --check HEAD^1 HEAD
      - name: Install Playwright
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.number != 61 || steps.a05scope.outputs.changed == 'true' }}
        run: npm install --no-save playwright@1.56.1
      - name: Start static server and run Chromium
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.number != 61 || steps.a05scope.outputs.changed == 'true' }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/kidp-server.log 2>&1 &
          sleep 2
          node projects/kidp/qa_wave_a_browser.cjs
      - name: A05 Chromium acceptance
        if: ${{ steps.a05scope.outputs.changed == 'true' }}
        run: node scripts/qa_a05_browser.cjs

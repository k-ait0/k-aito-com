name: Sync published article index

on:
  push:
    branches: [main]
    paths:
      - 'content-index.js'
      - 'app.js'
      - 'site-content.js'
      - 'index.html'
      - 'projects/index.html'
      - 'data/project-card-status.v1.json'
      - 'scripts/sync-project-cards.cjs'
      - 'scripts/test-project-cards.cjs'
      - 'white-surfaces-v1.css'
      - 'scripts/sync-white-surfaces.cjs'
      - 'notes/**/index.html'
      - 'scripts/sync-published-content.cjs'
      - 'scripts/article-search-text.cjs'
      - 'scripts/test-published-content.cjs'
      - '.github/workflows/sync-published-content.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: published-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate scripts and generate site index
        run: |
          node --check content-index.js
          node --check site-content.js
          node --check app.js
          node --check scripts/sync-project-cards.cjs
          node --check scripts/test-project-cards.cjs
          node --check scripts/sync-white-surfaces.cjs
          node --check scripts/sync-published-content.cjs
          node --check scripts/article-search-text.cjs
          node --check scripts/test-published-content.cjs
          node scripts/test-project-cards.cjs
          node scripts/sync-project-cards.cjs
          node scripts/test-published-content.cjs
          node scripts/sync-published-content.cjs
          node scripts/sync-white-surfaces.cjs
          node scripts/site-static-check.cjs
          git diff --check

      - name: Commit generated output when changed
        run: |
          if git diff --quiet; then
            echo "Article index already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Sync sitemap and article index from published catalogue"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced during the generated commit; retrying after fetch (attempt ${attempt})."
          done
          echo "Could not push generated site after 3 attempts." >&2
          exit 1

name: Build high-resolution notebook photo

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-notebook-photo.py'
      - '.github/workflows/build-notebook-photo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Download and optimize licensed source
        run: python scripts/build-notebook-photo.py
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/notebook-photo.webp
          if git diff --cached --quiet; then
            echo "No image changes."
            exit 0
          fi
          git commit -m "Add high-resolution notebook article photo"
          git push origin HEAD:main

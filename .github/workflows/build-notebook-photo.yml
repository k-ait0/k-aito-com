name: Build high-resolution notebook photo

on:
  # Manual-only. See docs/GITHUB_ACTIONS_POLICY.md.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type BUILD_NOTEBOOK_TO_MAIN to permit reviewed main write"
        required: true
        type: string
      expected_main_sha:
        description: "Full 40-character HEAD SHA of the reviewed main branch"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-photo:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'BUILD_NOTEBOOK_TO_MAIN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify reviewed main SHA before any write-capable step
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "FAIL: expected_main_sha must be a full lowercase commit SHA" >&2; exit 1; }
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_MAIN_SHA" ]] || { echo "FAIL: main changed; review the new SHA before trying again" >&2; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Download and optimize licensed source
        run: python scripts/build-notebook-photo.py
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/notebook-photo.webp
          if git diff --cached --quiet; then
            echo "No image changes."
            exit 0
          fi
          git commit -m "Add high-resolution notebook article photo"
          git push origin HEAD:main

name: SEO static audit

on:
  # Manual-only. See docs/GITHUB_ACTIONS_POLICY.md.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate SEO audit script
        run: node --check scripts/audit-seo.cjs
      - name: Audit published URLs
        run: node scripts/audit-seo.cjs

name: Temporary KIDP branch QA
on:
  push:
    branches: [feature/kidp-series-20261007]
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static references
        run: |
          node --check scripts/site-static-check.cjs
          node scripts/site-static-check.cjs
      - name: Install Playwright
        run: |
          npm install --prefix /tmp/kaito-qa --no-audit --no-fund --no-save playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/tmp/kaito-browsers /tmp/kaito-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser QA
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: node scripts/browser-smoke.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kidp-branch-qa-screenshots
          path: qa-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 2

# trigger: metadata-and-sitemap-ready

name: MONO BASE site QA
on:
  pull_request:
    paths:
      - 'mono-base/**'
      - '.github/workflows/mono-base-qa.yml'
  workflow_dispatch:
jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local links and required pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          root=Path('mono-base')
          required=['index.html','aircraft.html','robotics.html','space.html','design-lab.html','technology.html','journal.html','about.html']
          assert all((root/p).is_file() for p in required), 'Required page missing'
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  for key in ('href','src'):
                      if key in a:self.links.append(a[key])
          broken=[]
          for page in root.glob('*.html'):
              parser=Links();parser.feed(page.read_text(encoding='utf-8'))
              for link in parser.links:
                  parts=urlsplit(link)
                  if parts.scheme or parts.netloc or link.startswith(('#','data:','mailto:','tel:','/')):continue
                  target=(page.parent/unquote(parts.path)).resolve()
                  if parts.path and not target.is_file():broken.append((str(page),link))
          assert not broken, f'Broken local links: {broken}'
          print(f'PASS: {len(list(root.glob("*.html")))} pages, no broken local references')
          PY
      - name: Run lightweight concept preview gate
        run: node scripts/test-mono-base-preview.cjs
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Desktop and mobile screenshots
        run: |
          python -m http.server 8765 --directory mono-base >/tmp/mono-server.log 2>&1 &
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('mono-base-qa-artifacts');out.mkdir(exist_ok=True)
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for name,viewport in [('desktop',{'width':1440,'height':900}),('mobile',{'width':390,'height':844})]:
                  page=browser.new_page(viewport=viewport)
                  errors=[]
                  page.on('pageerror',lambda e: errors.append(str(e)))
                  page.goto('http://127.0.0.1:8765/index.html',wait_until='domcontentloaded')
                  page.screenshot(path=str(out/f'home-{name}.png'),full_page=True)
                  page.goto('http://127.0.0.1:8765/design-lab.html',wait_until='domcontentloaded')
                  page.screenshot(path=str(out/f'design-lab-{name}.png'),full_page=True)
                  assert page.locator('h1').count()==1
                  assert not errors, f'{name}: {errors}'
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mono-base-browser-qa
          path: mono-base-qa-artifacts/

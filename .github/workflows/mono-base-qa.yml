# Fast pull-request checks. Heavy Chromium/WebGL QA is manual-only.
# At final release review, run this workflow with workflow_dispatch on the
# exact proposed release branch HEAD, then verify its run ID and conclusion.
# Before this file reaches the default branch, adding label mono-base-full-qa
# to the Draft PR is the supported browser-QA trigger. Remove/re-add to rerun.
name: MONO BASE site QA
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'mono-base/**'
      - 'scripts/public-sitemap-routes.cjs'
      - 'scripts/test-public-sitemap-routes.cjs'
      - 'scripts/audit-seo.cjs'
      - 'scripts/live-production-check.cjs'
      - 'scripts/browser-smoke.cjs'
      - 'scripts/prepare-mono-base-publication.cjs'
      - 'scripts/test-mono-base-preview.cjs'
      - 'scripts/test-mono-base-generator-isolation.cjs'
      - 'scripts/test-mono-base-publication-fixture.cjs'
      - 'scripts/mono-base-local-qa.cjs'
      - 'scripts/sync-site-shell.cjs'
      - 'scripts/sync-site-breadcrumbs.cjs'
      - 'scripts/sync-white-surfaces.cjs'
      - 'scripts/sync-project-search.cjs'
      - 'scripts/test-site-shell.cjs'
      - 'scripts/test-site-breadcrumbs.cjs'
      - 'scripts/test-site-search-ui.cjs'
      - 'scripts/test-project-search.cjs'
      - 'scripts/verify-mono-base-original-assets.py'
      - 'scripts/test-mono-base-v34-browser.py'
      - 'scripts/test-mono-base-v35-controls.cjs'
      - '.github/workflows/mono-base-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mono-base-qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  static-qa:
    # Ignore irrelevant label changes so they consume no runner minutes.
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'mono-base-full-qa'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local links and required pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          root=Path('mono-base')
          required=['index.html','aircraft.html','robotics.html','space.html','design-lab.html','technology.html','journal.html','about.html']
          assert all((root/p).is_file() for p in required), 'Required page missing'
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  for key in ('href','src'):
                      if key in a:self.links.append(a[key])
          broken=[]
          for page in root.glob('*.html'):
              parser=Links();parser.feed(page.read_text(encoding='utf-8'))
              for link in parser.links:
                  parts=urlsplit(link)
                  if parts.scheme or parts.netloc or link.startswith(('#','data:','mailto:','tel:','/')):continue
                  target=(page.parent/unquote(parts.path)).resolve()
                  if parts.path and not target.is_file():broken.append((str(page),link))
          assert not broken, f'Broken local links: {broken}'
          print(f'PASS: {len(list(root.glob("*.html")))} pages, no broken local references')
          PY
      - name: Check KAITO and MONO BASE public URL compatibility
        run: |
          node --check scripts/public-sitemap-routes.cjs
          node --check scripts/test-public-sitemap-routes.cjs
          node --check scripts/audit-seo.cjs
          node --check scripts/live-production-check.cjs
          node --check scripts/browser-smoke.cjs
          node --check scripts/prepare-mono-base-publication.cjs
          node scripts/test-public-sitemap-routes.cjs
          node scripts/prepare-mono-base-publication.cjs --check
          # Current KAITO generators must remain isolated from the
          # independently styled MONO BASE pages when indexing is enabled.
          node --check scripts/sync-site-shell.cjs
          node --check scripts/sync-site-breadcrumbs.cjs
          node --check scripts/sync-white-surfaces.cjs
          node --check scripts/sync-project-search.cjs
          node --check scripts/test-mono-base-generator-isolation.cjs
          node scripts/test-mono-base-generator-isolation.cjs
          node --check scripts/test-mono-base-publication-fixture.cjs
          node --check scripts/mono-base-local-qa.cjs
          node scripts/test-mono-base-publication-fixture.cjs
          node scripts/test-site-shell.cjs
          node scripts/test-site-breadcrumbs.cjs
          node scripts/test-site-search-ui.cjs
          node scripts/test-project-search.cjs
      - name: Validate MONO BASE preview or public SEO metadata
        run: node scripts/test-mono-base-preview.cjs
      - name: Validate v3.5 accessible controls and reset contract
        run: node scripts/test-mono-base-v35-controls.cjs
      - name: Verify original v3.4 image hashes when integrated
        run: |
          if [ -f mono-base/cad-viewer.html ]; then
            python scripts/verify-mono-base-original-assets.py mono-base
          else
            echo 'Draft scaffold only — original v3.4 image integration not yet complete'
          fi
  browser-qa:
    # Never install Chromium on ordinary PR updates; one explicit final QA
    # dispatch is required for release approval.
    # Draft PR manual trigger: add the "mono-base-full-qa" label.
    # Only the labeling event triggers Chromium; later PR pushes stay static-only.
    # workflow_dispatch becomes available once this workflow exists on main.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'mono-base-full-qa')
    needs: static-qa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify WebGL viewer and interactive controls on desktop/mobile
        run: |
          python -m http.server 8765 --directory mono-base >/tmp/mono-server.log 2>&1 &
          if [ -f mono-base/cad-viewer.html ]; then
            python scripts/test-mono-base-v34-browser.py
          else
            python scripts/test-mono-base-browser.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mono-base-browser-qa
          path: mono-base-qa-artifacts/

name: A05 D265 synthetic-only analytics dashboard QA and isolated preview
on:
  push:
    branches:
      - research/a05-analytics-dashboard-d265-20261120
    paths:
      - '.github/workflows/a05-d265-synthetic-dashboard.yml'
      - 'research/a05/d265-synthetic-dashboard-template.html'
      - 'scripts/a05-d265-build-synthetic-dashboard.mjs'
      - 'scripts/test-a05-d265-synthetic-dashboard.cjs'
      - 'scripts/a05-d265-live-preview-audit.mjs'
      - 'docs/A05_D265_PRIVACY_GOVERNANCE_AND_DASHBOARD_20261120.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: a05-d265-synthetic-only-publish
  cancel-in-progress: false
jobs:
  synthetic-dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard earlier A05 public pages before publishing anything
        run: |
          git fetch origin gh-pages
          test "$(git show origin/gh-pages:index.html | sha256sum | cut -d' ' -f1)" = 'd4be3ac612c7bc1cad07bbbb385a7b6910614ac0356598ae6345d7ed5300d070'
          test "$(git show origin/gh-pages:preview/yn/index.html | sha256sum | cut -d' ' -f1)" = '5cf61a5114e69c292080be803ae835c5e75d400f4a773a8e89fb2347547d11e1'
          test "$(git show origin/gh-pages:preview/yn-v2/index.html | sha256sum | cut -d' ' -f1)" = '31d6ecf62393c24100604c51a1ba0ec280369f8780e37c2bc775b1913ba6dfc8'
          test "$(git show origin/gh-pages:preview/yn-v21/index.html | sha256sum | cut -d' ' -f1)" = '39a07c893b1060b06f0a6050d2610510f494eb85801034c2b85ecee811164c0f'
          test "$(git show origin/gh-pages:preview/yn-v22/index.html | sha256sum | cut -d' ' -f1)" = 'fa0919ce234aa01674f52a1ee999bea4fe0d92695ae9cc9e1924fd18ca9bdc61'
      - name: Run existing aggregation unit tests and build fake dashboard
        run: |
          node --test scripts/test-a05-d261-analytics-contract.mjs
          node --test scripts/test-a05-d264-quality-rollups.mjs
          node --check scripts/a05-d265-build-synthetic-dashboard.mjs
          node --check scripts/test-a05-d265-synthetic-dashboard.cjs
          node scripts/a05-d265-build-synthetic-dashboard.mjs
          test -s research/a05/generated/d265-synthetic-analytics-dashboard.html
          grep -q 'connect-src .none.' research/a05/generated/d265-synthetic-analytics-dashboard.html
          grep -q '合成データ' research/a05/generated/d265-synthetic-analytics-dashboard.html
      - name: Use preinstalled Chrome with local Playwright package
        run: |
          npm install --prefix /tmp/a05-d265-playwright --no-audit --no-fund --no-save playwright@1.56.1
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --version
          echo "A05_CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Gate local browser layouts, exact denominators, filters, and no network
        env:
          NODE_PATH: /tmp/a05-d265-playwright/node_modules
        run: node scripts/test-a05-d265-synthetic-dashboard.cjs
      - name: Publish only synthetic new preview path and preserve all older URLs
        run: |
          cp research/a05/generated/d265-synthetic-analytics-dashboard.html /tmp/a05-d265-tested.html
          cp scripts/a05-d265-live-preview-audit.mjs /tmp/a05-d265-live-preview-audit.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          mkdir -p preview/a05-analytics-d265
          cp /tmp/a05-d265-tested.html preview/a05-analytics-d265/index.html
          git add preview/a05-analytics-d265/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish only A05 D265 synthetic analytics dashboard preview"
            git push origin HEAD:refs/heads/gh-pages
          fi
          test "$(git show HEAD:index.html | sha256sum | cut -d' ' -f1)" = 'd4be3ac612c7bc1cad07bbbb385a7b6910614ac0356598ae6345d7ed5300d070'
          test "$(git show HEAD:preview/yn/index.html | sha256sum | cut -d' ' -f1)" = '5cf61a5114e69c292080be803ae835c5e75d400f4a773a8e89fb2347547d11e1'
          test "$(git show HEAD:preview/yn-v2/index.html | sha256sum | cut -d' ' -f1)" = '31d6ecf62393c24100604c51a1ba0ec280369f8780e37c2bc775b1913ba6dfc8'
          test "$(git show HEAD:preview/yn-v21/index.html | sha256sum | cut -d' ' -f1)" = '39a07c893b1060b06f0a6050d2610510f494eb85801034c2b85ecee811164c0f'
          test "$(git show HEAD:preview/yn-v22/index.html | sha256sum | cut -d' ' -f1)" = 'fa0919ce234aa01674f52a1ee999bea4fe0d92695ae9cc9e1924fd18ca9bdc61'
      - name: Verify public mock dashboard HTML matches reviewed bytes exactly
        run: node /tmp/a05-d265-live-preview-audit.mjs /tmp/a05-d265-tested.html

name: Analytics v0.33 real Chromium offline acceptance (research)
on:
  push:
    branches:
      - analytics-browser-acceptance-v0-33-20261118
    paths:
      - '.github/workflows/analytics-offline-browser-v033.yml'
      - 'scripts/test-analytics-offline-preview-v033.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild offline file and ensure byte reproducibility
        run: |
          set -euo pipefail
          node scripts/build-analytics-offline-preview-v032.cjs
          git diff --exit-code -- research/analytics/K_Aito_Analytics_Offline_Preview_v032.html
      - name: Run all existing analytics Node regressions
        run: node --test scripts/test-analytics-*.cjs
      - name: Install Playwright and Chromium for actual file URL E2E
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install chromium
      - name: Install Japanese fonts for visual evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family}\n' 'sans:lang=ja'
      - name: Run 14 real offline Chromium acceptance cases
        run: python scripts/test-analytics-offline-preview-v033.py
      - name: Save synthetic-only research acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-v033-browser-qa-synthetic-only
          path: |
            docs/qa/analytics-v033-chromium-results.json
            docs/qa/analytics-v033-screenshots/v033-*.png
          if-no-files-found: warn
          retention-days: 5

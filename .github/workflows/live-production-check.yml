name: Live XServer deployment verification

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '**/*.html'
      - '*.css'
      - '**/*.css'
      - '*.js'
      - '**/*.js'
      - 'scripts/browser-smoke.cjs'
      - 'scripts/live-production-check.cjs'
      - 'assets/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'og-image.png'
      - '.github/workflows/live-production-check.yml'
  workflow_run:
    workflows: ['Sync published article index']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaito-live-verification
  cancel-in-progress: true

jobs:
  compare-production:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out expected revision
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: node --check scripts/live-production-check.cjs
      - name: Wait for XServer and compare deployed files
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/live-production-check.cjs; then
              echo "Live deployment matches GitHub main."
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Live deployment did not match after six checks." >&2
              exit 1
            fi
            echo "Deployment not ready; retrying in 20 seconds ($attempt/6)."
            sleep 20
          done
      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/kaito-qa --no-audit --no-fund --no-save playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/tmp/kaito-browsers /tmp/kaito-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise live site on desktop and mobile Chromium
        env:
          KAITO_BASE_URL: https://k-aito.com
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: node scripts/browser-smoke.cjs
      - name: Upload production browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaito-production-mobile-desktop
          path: qa-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

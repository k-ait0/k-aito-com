name: Temporary KIDP005 test tools QA
on:
  push:
    branches: [feature/kidp005-p0-test-tools-20261007]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static references
        run: node scripts/site-static-check.cjs
      - name: Install Playwright
        run: |
          npm install --prefix /tmp/kaito-qa --no-audit --no-fund --no-save playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/tmp/kaito-browsers /tmp/kaito-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Existing browser QA
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: node scripts/browser-smoke.cjs
      - name: KIDP005 test tools
        env:
          NODE_PATH: /tmp/kaito-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/kaito-browsers
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kidp005-test-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            const normal=await b.newPage({viewport:{width:390,height:844}});
            await normal.goto('http://127.0.0.1:4173/projects/kidp/board-game-balancer/prototype/',{waitUntil:'networkidle'});
            if(await normal.locator('.test-panel').isVisible()) throw Error('normal mode exposes test UI');
            await normal.close();

            const p=await b.newPage({viewport:{width:390,height:844}});
            await p.goto('http://127.0.0.1:4173/projects/kidp/board-game-balancer/prototype/?test=1&pid=P01',{waitUntil:'networkidle'});
            if(!await p.locator('.test-panel').isVisible()) throw Error('test UI hidden');
            if(await p.locator('#participantId').inputValue()!=='P01') throw Error('pid');
            await p.locator('#rush').evaluate(el=>{el.value='4.0';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await p.locator('#engine').evaluate(el=>{el.value='1.1';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await p.click('#runBtn');
            await p.click('#breakBtn');
            await p.click('#resetBtn');
            await p.selectOption('#m1Input','yes');await p.selectOption('#m2Input','yes');await p.selectOption('#m3Input','yes');await p.selectOption('#m4Input','yes');await p.selectOption('#m5Input','no');await p.selectOption('#nextStrategy','rush');
            const payload=await p.evaluate(()=>testPayload());
            if(payload.slider_changes!==2) throw Error('slider changes '+payload.slider_changes);
            if(payload.run_count!==1||payload.break_used!==true||payload.reset_count!==1) throw Error('action counts '+JSON.stringify(payload));
            if(payload.final_signal!=='BALANCED-ish') throw Error('final signal '+payload.final_signal);
            const cols=await p.evaluate(()=>{const s=testCsv();let q=false,count=1;for(let i=0;i<s.length;i++){if(s[i]==='"'){if(q&&s[i+1]==='"')i++;else q=!q}else if(s[i]===','&&!q)count++}return count});
            if(cols!==19) throw Error('CSV columns '+cols);
            await p.reload({waitUntil:'networkidle'});
            if((await p.locator('#mSlider').innerText()).trim()!=='2') throw Error('stored slider changes');
            await p.close();

            for(const [name,w,h] of [['desktop',1440,900],['mobile',390,844]]){
              const r=await b.newPage({viewport:{width:w,height:h}});
              await r.goto('http://127.0.0.1:4173/projects/kidp/board-game-balancer/test-review/',{waitUntil:'networkidle'});
              if(await r.locator('.url-row').count()!==10) throw Error(name+' links');
              await r.click('#sample');await r.click('#analyze');
              if(await r.locator('#decision strong').innerText()!=='P1 GO') throw Error(name+' sample decision '+await r.locator('#decision strong').innerText());
              if(await r.locator('#m1').innerText()!=='100%'||await r.locator('#m5').innerText()!=='0%') throw Error(name+' metrics');
              const one=await r.evaluate(()=>{const rows=parseCSV(document.querySelector('#csvInput').value);return [rows[0],rows[1]].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n')});
              await r.fill('#csvInput',one);await r.click('#analyze');
              if(await r.locator('#decision strong').innerText()!=='MORE DATA') throw Error(name+' <5 decision');
              const overflow=await r.evaluate(()=>document.documentElement.scrollWidth-innerWidth);
              if(overflow>2) throw Error(name+' overflow '+overflow);
              await r.close();
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
